<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Course — Complete Study Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --blue: #38bdf8; --green: #34d399; --red: #f87171; --yellow: #fbbf24;
    --purple: #a78bfa; --pink: #f472b6; --orange: #fb923c; --cyan: #22d3ee;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--blue); text-decoration: none; }

  /* NAV */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--surface2); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 1.2rem; color: var(--blue); }
  .topbar .stats { display: flex; gap: 1.2rem; font-size: 0.85rem; color: var(--muted); }
  .topbar .stats span { display: flex; align-items: center; gap: 0.3rem; }
  .topbar .stats .val { color: var(--green); font-weight: 600; }

  /* HOME */
  .home { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .home-header { text-align: center; margin-bottom: 2rem; }
  .home-header h2 { font-size: 2rem; margin-bottom: 0.5rem; }
  .home-header p { color: var(--muted); }

  .part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .part-card { background: var(--surface); border: 2px solid var(--surface2); border-radius: 12px; padding: 1.3rem;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .part-card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .part-card .part-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.4rem; font-weight: 600; }
  .part-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  .part-card .modules { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .part-card .progress-pip { position: absolute; top: 1rem; right: 1rem; font-size: 0.75rem; color: var(--dim);
    background: var(--bg); padding: 0.2rem 0.5rem; border-radius: 4px; }
  .p1 .part-num { color: var(--blue); } .p1:hover { border-color: var(--blue); }
  .p2 .part-num { color: var(--purple); } .p2:hover { border-color: var(--purple); }
  .p3 .part-num { color: var(--pink); } .p3:hover { border-color: var(--pink); }
  .p4 .part-num { color: var(--orange); } .p4:hover { border-color: var(--orange); }

  .mode-row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
  .mode-pill { padding: 0.5rem 1.1rem; border: 2px solid var(--surface2); border-radius: 99px; background: var(--surface);
    color: var(--muted); cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
  .mode-pill:hover, .mode-pill.active { border-color: var(--blue); color: var(--blue); }

  /* MODULE PICKER */
  .module-picker { max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem; }
  .module-picker h2 { margin-bottom: 0.3rem; }
  .module-picker .sub { color: var(--muted); margin-bottom: 1.5rem; }
  .mod-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .mod-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem;
    background: var(--surface); border: 2px solid var(--surface2); border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .mod-item:hover { border-color: var(--blue); }
  .mod-item .mi-left { }
  .mod-item .mi-code { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .mod-item .mi-title { font-size: 1rem; }
  .mod-item .mi-count { font-size: 0.8rem; color: var(--dim); }
  .all-btn { margin-top: 0.8rem; padding: 0.8rem; text-align: center; background: var(--blue); color: var(--bg);
    font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 1rem; border: none; width: 100%; }
  .all-btn:hover { opacity: 0.9; }
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .back-link:hover { color: var(--blue); }

  /* GAME AREA */
  .game-wrap { max-width: 800px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
  .score-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem;
    background: var(--surface); border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
  .score-bar .sb-left { display: flex; gap: 1.2rem; }
  .score-bar .sc { color: var(--green); font-weight: 600; }
  .score-bar .st { color: var(--yellow); font-weight: 600; }
  .score-bar .sb-right { color: var(--dim); }

  .q-card { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .q-card .q-cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 0.5rem; }
  .q-card .q-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.2rem; }
  .q-card code { background: var(--surface2); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.88em; }

  .opts { display: grid; gap: 0.5rem; }
  .opt { padding: 0.75rem 1rem; border: 2px solid var(--surface2); border-radius: 8px; background: var(--bg);
    color: var(--text); cursor: pointer; font-size: 0.92rem; text-align: left; transition: all 0.12s; line-height: 1.4; }
  .opt:hover:not(.lk) { border-color: var(--dim); background: var(--surface); }
  .opt.ok { border-color: var(--green); background: #064e3b; color: #a7f3d0; }
  .opt.no { border-color: var(--red); background: #7f1d1d; color: #fca5a5; }
  .opt.lk { cursor: default; opacity: 0.55; }
  .opt.lk.ok { opacity: 1; }

  .expl { margin-top: 1rem; padding: 1rem; background: var(--surface2); border-radius: 8px;
    font-size: 0.88rem; line-height: 1.5; color: var(--text); display: none; }
  .expl.show { display: block; }
  .expl.wrong { border-left: 3px solid var(--red); }
  .expl.right { border-left: 3px solid var(--green); }
  .expl .expl-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; font-weight: 600; }
  .expl .expl-label.red { color: var(--red); }
  .expl .expl-label.green { color: var(--green); }
  .expl .expl-correct { color: var(--green); font-weight: 600; margin-bottom: 0.4rem; }
  .expl .expl-picked { color: var(--red); margin-bottom: 0.4rem; font-style: italic; }
  .expl .expl-why { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); color: var(--muted); }
  .expl .review-link { display: inline-block; margin-top: 0.7rem; padding: 0.35rem 0.8rem; border: 1px solid var(--blue);
    border-radius: 6px; font-size: 0.8rem; color: var(--blue); transition: all 0.15s; }
  .expl .review-link:hover { background: #1e3a5f; }

  .nxt { display: none; margin-top: 1rem; padding: 0.65rem 2rem; border: none; border-radius: 8px;
    background: var(--blue); color: var(--bg); font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .nxt:hover { opacity: 0.9; }
  .nxt.show { display: inline-block; }

  /* Timer */
  .timer-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--blue); transition: width 0.08s linear; }
  .timer-fill.danger { background: var(--red); }

  /* Matching */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .match-col { display: flex; flex-direction: column; gap: 0.5rem; }
  .match-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 0.2rem; }
  .mi2 { padding: 0.65rem 0.8rem; border: 2px solid var(--surface2); border-radius: 8px; background: var(--bg);
    cursor: pointer; font-size: 0.85rem; transition: all 0.12s; line-height: 1.3; }
  .mi2:hover:not(.done) { border-color: var(--dim); }
  .mi2.sel { border-color: var(--blue); background: #1e3a5f; }
  .mi2.done { border-color: var(--green); background: #064e3b; color: #a7f3d0; cursor: default; opacity: 0.7; }
  .mi2.flash { border-color: var(--red); background: #7f1d1d; }

  /* Flashcards */
  .fc-card { perspective: 800px; cursor: pointer; margin-bottom: 1rem; }
  .fc-inner { position: relative; width: 100%; min-height: 200px; transition: transform 0.5s; transform-style: preserve-3d; }
  .fc-card.flipped .fc-inner { transform: rotateY(180deg); }
  .fc-front, .fc-back { position: absolute; width: 100%; min-height: 200px; backface-visibility: hidden;
    border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .fc-front { background: var(--surface); border: 2px solid var(--surface2); }
  .fc-back { background: #1e3a5f; border: 2px solid var(--blue); transform: rotateY(180deg); }
  .fc-front .fc-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 0.8rem; }
  .fc-front .fc-q { font-size: 1.15rem; line-height: 1.5; }
  .fc-back .fc-a { font-size: 1.05rem; line-height: 1.5; }
  .fc-hint { font-size: 0.8rem; color: var(--dim); margin-top: 1rem; }
  .fc-nav { display: flex; gap: 0.8rem; justify-content: center; align-items: center; }
  .fc-nav button { padding: 0.5rem 1.5rem; border: 2px solid var(--surface2); border-radius: 8px;
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.9rem; }
  .fc-nav button:hover { border-color: var(--blue); }
  .fc-nav .fc-count { color: var(--dim); font-size: 0.85rem; min-width: 80px; text-align: center; }
  .fc-rate { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
  .fc-rate button { padding: 0.4rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .fc-rate .fc-hard { background: #7f1d1d; color: #fca5a5; }
  .fc-rate .fc-ok { background: #854d0e; color: #fde68a; }
  .fc-rate .fc-easy { background: #064e3b; color: #a7f3d0; }

  /* Summary */
  .summary { text-align: center; padding: 2rem; }
  .summary h2 { color: var(--blue); margin-bottom: 1rem; }
  .summary .big { font-size: 3.5rem; font-weight: 700; }
  .summary .detail { color: var(--muted); margin: 0.4rem 0; }
  .summary .grade { font-size: 1.2rem; margin: 1rem 0; }
  .restart { margin-top: 1rem; padding: 0.65rem 2rem; border: 2px solid var(--blue); border-radius: 8px;
    background: transparent; color: var(--blue); font-size: 0.95rem; cursor: pointer; margin-right: 0.5rem; }
  .restart:hover { background: #1e3a5f; }

  /* Cheat sheet */
  .sheet { max-width: 900px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
  .sheet h2 { margin-bottom: 1rem; }
  .sheet-section { background: var(--surface); border-radius: 10px; padding: 1.2rem; margin-bottom: 0.8rem; }
  .sheet-section h3 { font-size: 0.95rem; color: var(--blue); margin-bottom: 0.6rem; }
  .sheet-section ul { padding-left: 1.2rem; }
  .sheet-section li { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
  .sheet-section li strong { color: var(--text); }

  @media (max-width: 600px) {
    .match-grid { grid-template-columns: 1fr; }
    .part-grid { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="navTitle" style="cursor:pointer">ML Study Tool</h1>
  <div class="stats">
    <span>Score: <span class="val" id="globalScore">0</span></span>
    <span>Streak: <span class="val" id="globalStreak">0</span></span>
    <span>Best: <span class="val" id="globalBest">0</span></span>
  </div>
</div>

<div id="app"></div>

<script>
// ===================== DATA =====================
const Q = [
// ---- 1B: Linear Regression ----
{m:"1B",c:"Equation",q:"What is the closed-form OLS (Ordinary Least Squares) solution?",a:"w* = (X^T X)^(-1) X^T y",d:["w* = X^T y","w* = (X^T X) X^T y","w* = X (X^T X)^(-1) y"],x:"Set gradient of ||y - Xw||^2 to zero and solve."},
{m:"1B",c:"Concept",q:"What does the hat matrix H = X(X^T X)^(-1)X^T do?",a:"Projects y onto the column space of X",d:["Rotates y into feature space","Inverts the covariance","Normalizes residuals"],x:"y-hat = Hy is the orthogonal projection of y onto Col(X)."},
{m:"1B",c:"Weakness",q:"Main weakness of OLS (Ordinary Least Squares) when p (features) is large?",a:"Overfitting and multicollinearity",d:["Underfitting","Slow gradient descent","Can't handle categoricals"],x:"When p >> n, OLS fits noise. Correlated features make X^T X nearly singular."},
{m:"1B",c:"Algorithm",q:"Ridge regression adds what penalty?",a:"lambda * ||w||^2 (squared L2 norm)",d:["lambda * ||w||_1 (L1 norm)","Constraint that w > 0","Extra bias term"],x:"Shrinks coefficients toward zero but never exactly to zero. Bayesian: Gaussian prior."},
{m:"1B",c:"Algorithm",q:"Which regularizer drives weights exactly to zero?",a:"Lasso (L1)",d:["Ridge (L2)","Elastic Net only","Polynomial"],x:"L1's diamond constraint has corners on axes, so solutions land at exact zeros."},
{m:"1B",c:"Concept",q:"Polynomial regression is still linear. Why?",a:"Linear in parameters w, nonlinear in x",d:["Uses linear activation","Features always independent","Only works on linear data"],x:"phi(x)=[1,x,x^2,...] is nonlinear, but y=w^T phi(x) is linear in w.",w:{"Only works on linear data":"It works on nonlinear data — that's the whole point. The features are nonlinear transforms of x.","Uses linear activation":"Activation functions are a neural network concept, not relevant to regression."}},
{m:"1B",c:"Metric",q:"R^2 = 0.85 means:",a:"Model explains 85% of variance in y",d:["85% accurate","85% within 1 std dev","Correlation is 0.85"],x:"R^2 = 1 - SS_res/SS_tot, comparing to a naive mean predictor."},
{m:"1B",c:"Complexity",q:"Time complexity of OLS (Ordinary Least Squares) closed-form?",a:"O(p^3) due to matrix inversion",d:["O(np)","O(n^2 p)","O(p^2)"],x:"Inverting the p x p matrix dominates. For large p, use gradient descent."},
{m:"1B",c:"Concept",q:"Bias-variance decomposition of MSE (Mean Squared Error):",a:"Bias^2 + Variance + irreducible noise",d:["Bias + Variance","Bias^2 + Variance^2","Bias * Variance + noise"],x:"Can't reduce all three. Complex model = low bias, high variance.",w:{"Bias + Variance":"Close, but bias is squared in the decomposition — the derivation squares (f - E[f-hat]) when expanding the expectation.","Bias^2 + Variance^2":"Variance is already E[(f-hat - E[f-hat])^2], which is a squared quantity. Squaring it again would be wrong."}},

// ---- 1C: Classification ----
{m:"1C",c:"Equation",q:"The sigmoid function is:",a:"sigma(z) = 1 / (1 + e^(-z))",d:["sigma(z) = e^z / (1+e^z)^2","sigma(z) = tanh(z)","sigma(z) = max(0,z)"],x:"Maps R to (0,1) for probabilities in logistic regression."},
{m:"1C",c:"Loss",q:"Logistic regression minimizes:",a:"Binary cross-entropy (negative log-likelihood)",d:["MSE (Mean Squared Error)","Hinge loss","Huber loss"],x:"NLL (Negative Log-Likelihood) = -sum[y log(y-hat) + (1-y)log(1-y-hat)]. From Bernoulli MLE."},
{m:"1C",c:"Concept",q:"Why is squared error bad for logistic regression?",a:"Non-convex surface with local minima and gradient saturation",d:["Requires matrix inversion","Can't handle binary labels","Always underfits"],x:"When sigmoid saturates, squared error gradient vanishes.",w:{"Can't handle binary labels":"Squared error can technically handle 0/1 labels — it just creates a non-convex loss surface with sigmoid, making optimization unreliable.","Always underfits":"The issue is the opposite direction — the loss landscape has bad local minima, making optimization unreliable, not that the model is too simple."}},
{m:"1C",c:"Algorithm",q:"Softmax generalizes sigmoid to:",a:"K classes: P(y=k|x) = e^(w_k^T x) / sum e^(w_j^T x)",d:["Tanh to multi-output","ReLU to probabilities","Step function to fuzzy logic"],x:"For K=2, softmax reduces to sigmoid."},
{m:"1C",c:"Concept",q:"Naive Bayes' key (usually wrong) assumption:",a:"Features are conditionally independent given the class",d:["Classes equally likely","Features normally distributed","Boundary is linear"],x:"Almost always wrong, yet works because only decision boundary needs to be correct."},
{m:"1C",c:"Algorithm",q:"Soft-margin SVM (Support Vector Machine) minimizes:",a:"(1/2)||w||^2 + C * sum(xi_i) with margin constraints",d:["Cross-entropy + L2","Sum of squared residuals","KL divergence"],x:"C controls tradeoff: large C = hard margin, small C = wider margin."},
{m:"1C",c:"Concept",q:"The kernel trick avoids:",a:"Explicitly computing high-dimensional feature maps",d:["Matrix inversion","Gradient computation","Cross-validation"],x:"K(x_i,x_j) = phi(x_i)^T phi(x_j) without forming phi."},
{m:"1C",c:"Algorithm",q:"RBF (Radial Basis Function) kernel maps to what feature space?",a:"Infinite-dimensional",d:["2D","Same as input","p^2 dimensional"],x:"Taylor expansion of the Gaussian has infinite terms."},
{m:"1C",c:"Metric",q:"When is precision more important than recall?",a:"When false positives are costly",d:["Balanced dataset","False negatives costly","Need high accuracy"],x:"Precision = TP/(TP+FP). High precision = few false alarms."},
{m:"1C",c:"Metric",q:"F1 score uses what type of mean?",a:"Harmonic",d:["Arithmetic","Geometric","Weighted"],x:"F1 = 2PR/(P+R). Harmonic mean penalizes imbalance."},
{m:"1C",c:"Algorithm",q:"LDA (Linear Discriminant Analysis) assumes all classes share the same ___ but different ___.",a:"Covariance matrix; means",d:["Means; variances","Priors; likelihoods","Features; labels"],x:"P(x|y=k) ~ N(mu_k, Sigma) with shared Sigma."},

// ---- 1D: Model Selection ----
{m:"1D",c:"Concept",q:"The 'cardinal sin' of evaluation:",a:"Using test set for model selection",d:["No regularization","Too many epochs","Too many features"],x:"Once you peek at test set for decisions, it's no longer unbiased."},
{m:"1D",c:"Algorithm",q:"In k-fold CV (Cross-Validation), each fold is validation how many times?",a:"Exactly once",d:["k times","k-1 times","Twice"],x:"Each fold held out once, used for training k-1 times."},
{m:"1D",c:"Concept",q:"Why does random search often beat grid search?",a:"Explores more unique values per dimension",d:["Always faster","Uses Bayesian optimization","Avoids local minima"],x:"Grid wastes evaluations on unimportant dimensions."},
{m:"1D",c:"Concept",q:"Average fraction of unique points in a bootstrap sample:",a:"~63.2%",d:["~50%","~75%","~90%"],x:"P(included) = 1 - (1-1/n)^n -> 1 - 1/e ~ 0.632."},
{m:"1D",c:"Concept",q:"What is data leakage?",a:"Test/future information contaminates training",d:["Data lost in preprocessing","Features dropped accidentally","Model memorizes training"],x:"Example: standardizing with stats from entire dataset including test."},
{m:"1D",c:"Concept",q:"BIC (Bayesian Information Criterion) vs AIC (Akaike Information Criterion): BIC's penalty is:",a:"k*ln(n) vs AIC's 2k — heavier for large n",d:["Always lighter","Same penalty","2k^2"],x:"For large n, ln(n)>2, so BIC selects simpler models."},

// ---- 1E: Trees & Ensembles ----
{m:"1E",c:"Equation",q:"Gini impurity formula:",a:"G = 1 - sum(p_k^2)",d:["G = sum(p_k^2)","G = -sum(p_k log p_k)","G = sum(p_k(1-p_k)^2)"],x:"Zero for pure node, max when all classes equally represented."},
{m:"1E",c:"Concept",q:"Decision trees are greedy — what does this mean?",a:"Each split is locally optimal without considering future splits",d:["Use all features at once","Always find global optimum","Require sorted data"],x:"No backtracking or lookahead."},
{m:"1E",c:"Weakness",q:"Primary weakness of a single decision tree:",a:"High variance — small data changes produce different trees",d:["High bias","Slow training","Can't handle categoricals"],x:"Motivates ensembles: bagging averages many unstable trees."},
{m:"1E",c:"Algorithm",q:"Random Forest's key innovation over bagging:",a:"Random subset of m features considered at each split",d:["Deeper trees","Gradient descent","Post-training pruning"],x:"Decorrelates trees. Default m = sqrt(p) for classification."},
{m:"1E",c:"Concept",q:"Bagging reduces ___, boosting reduces ___.",a:"Variance; bias",d:["Bias; variance","Both bias","Both variance"],x:"Bagging averages noisy models. Boosting corrects errors sequentially.",w:{"Bias; variance":"Common mix-up. Bagging averages many high-variance models (like deep trees) to stabilize them. Boosting sequentially fixes errors, reducing systematic bias."}},
{m:"1E",c:"Algorithm",q:"In gradient boosting, each new tree fits:",a:"Negative gradient (pseudo-residuals) of the loss",d:["Original labels","Previous predictions","Random feature subsets"],x:"For MSE, negative gradient = residuals. Generalizes to any loss."},
{m:"1E",c:"Concept",q:"Why use a small learning rate in gradient boosting?",a:"Shrinkage prevents overfitting each correction",d:["Speeds training","Fewer trees needed","Deeper trees"],x:"Smaller eta = more trees but better generalization. Typical: 0.01-0.1."},
{m:"1E",c:"Concept",q:"Can adding more trees to a Random Forest overfit?",a:"No — more trees just reduce variance with diminishing returns",d:["Yes always","Only if shallow","Only with boosting"],x:"Unlike boosting, RF averaging can't overfit from more trees."},
{m:"1E",c:"Algorithm",q:"XGBoost's regularization includes:",a:"Penalty on leaf count (gamma*|T|) and L2 on leaf weights",d:["Only L1 on features","Dropout on trees","Batch normalization"],x:"Explicit tree complexity control in the objective."},
{m:"1E",c:"Algorithm",q:"LightGBM's key speed innovation:",a:"Histogram-based splitting — bin features into ~256 buckets",d:["Uses image histograms","Plots feature distributions","Only works with discrete data"],x:"Reduces split search from O(n) to O(bins)."},

// ---- 1F: Unsupervised ----
{m:"1F",c:"Equation",q:"PCA (Principal Component Analysis) finds eigenvectors of:",a:"Covariance matrix S = (1/(N-1)) X^T X",d:["Data matrix X","Identity matrix","Gram matrix XX^T"],x:"Eigenvectors = principal components. Eigenvalues = variance captured."},
{m:"1F",c:"Algorithm",q:"K-Means++ chooses new centroids with probability proportional to:",a:"D(x)^2 — squared distance to nearest centroid",d:["1/K uniformly","Point's L1 norm","Point's density"],x:"Spreads initial centroids out for better convergence."},
{m:"1F",c:"Concept",q:"K-Means is EM (Expectation-Maximization) on a GMM (Gaussian Mixture Model) with what constraint?",a:"Isotropic covariance sigma^2*I with sigma->0 (hard assignments)",d:["Equal means","Zero mixing weights","Full-rank covariances"],x:"K-Means is the hard-assignment limit of GMM."},
{m:"1F",c:"Weakness",q:"Critical limitation of t-SNE (t-Distributed Stochastic Neighbor Embedding) often overlooked:",a:"Between-cluster distances and cluster sizes are meaningless",d:["Only handles 2 features","Requires labels","Always same output"],x:"Preserves local structure only. Far-apart clusters might be close in original space."},
{m:"1F",c:"Algorithm",q:"EM (Expectation-Maximization) algorithm's E-step computes:",a:"Responsibilities — posterior probability of each cluster per point",d:["New cluster means","Log-likelihood","Feature importances"],x:"Bayes' theorem applied to each point: soft cluster assignments."},

{m:"1F",c:"Algorithm",q:"Ward's linkage minimizes:",a:"Increase in total within-cluster variance",d:["Max pairwise distance","Number of clusters","Dendrogram entropy"],x:"Produces compact, balanced clusters similar to K-Means."},

// ---- 2A: Neural Networks ----
{m:"2A",c:"Concept",q:"Why can't a single-layer perceptron solve XOR?",a:"XOR is not linearly separable",d:["Too many parameters","Gradient vanishes","Requires convolution"],x:"Adding a hidden layer creates a nonlinear decision boundary that solves XOR.",w:{"Too many parameters":"A single perceptron has very few parameters (just weights + bias). The issue isn't parameter count — it's that no single line can separate the XOR outputs.","Requires convolution":"Convolution is for spatial patterns in images. XOR is a simple logic problem solvable with a 2-layer fully connected network."}},
{m:"2A",c:"Concept",q:"The Universal Approximation Theorem states:",a:"A single hidden layer with enough neurons can approximate any continuous function",d:["Deep nets are always better","Neural nets find global optima","ReLU is the best activation"],x:"Guarantees existence but not learnability — doesn't say how many neurons or how to train."},
{m:"2A",c:"Algorithm",q:"Backpropagation computes gradients using:",a:"The chain rule applied through the computational graph",d:["Finite differences","Random perturbations","Matrix inversion"],x:"Reverse-mode autodiff: compute loss, then propagate gradients backward layer by layer."},
{m:"2A",c:"Concept",q:"ReLU's main advantage over sigmoid/tanh:",a:"No gradient saturation for positive inputs — faster training",d:["Always differentiable","Bounded output","Symmetric around zero"],x:"ReLU(x) = max(0,x). Gradient is 1 for x>0, avoiding the vanishing gradient problem.",w:{"Always differentiable":"ReLU is NOT differentiable at x=0. Sigmoid and tanh are actually smoother. ReLU wins despite this because its gradient doesn't vanish for positive inputs.","Bounded output":"ReLU is unbounded (outputs can grow to infinity). Sigmoid [0,1] and tanh [-1,1] are bounded. That's actually their weakness — saturation kills gradients.","Symmetric around zero":"Tanh is symmetric around zero, not ReLU. ReLU outputs 0 for all negative inputs."}},
{m:"2A",c:"Concept",q:"Forward mode vs reverse mode autodiff — when is reverse preferred?",a:"When outputs << inputs (most neural nets: scalar loss, many parameters)",d:["When inputs << outputs","Always","Never"],x:"Reverse mode computes all parameter gradients in one backward pass. Forward mode needs one pass per parameter."},

// ---- 2B: Optimization ----
{m:"2B",c:"Concept",q:"Why are saddle points more problematic than local minima in high dimensions?",a:"Saddle points are exponentially more common than local minima in high-D",d:["Saddle points have zero gradient","Local minima are rare","Saddle points are global optima"],x:"In high-D, a critical point is a local min only if ALL eigenvalues of the Hessian are positive — extremely unlikely.",w:{"Saddle points have zero gradient":"Both saddle points AND local minima have zero gradient — that's what makes them critical points. The difference is frequency: saddle points vastly outnumber local minima in high dimensions.","Local minima are rare":"This is actually true! But the question asks why saddle points are MORE problematic — it's because they're exponentially more common, so gradient descent gets stuck at them more often."}},
{m:"2B",c:"Algorithm",q:"Adam optimizer combines:",a:"Momentum (1st moment) + RMSProp (2nd moment) with bias correction",d:["SGD (Stochastic Gradient Descent) + dropout","L1 + L2 penalties","Learning rate + batch size"],x:"Adaptive per-parameter learning rates using running averages of gradient and squared gradient."},
{m:"2B",c:"Concept",q:"Batch Normalization normalizes across which dimension?",a:"The batch dimension — each feature normalized over the mini-batch",d:["Feature dimension","Time dimension","Layer dimension"],x:"For each feature: subtract batch mean, divide by batch std, then scale and shift with learned params."},
{m:"2B",c:"Concept",q:"What is the linear scaling rule for learning rate?",a:"When multiplying batch size by k, multiply learning rate by k",d:["Keep LR constant","Divide LR by k","Square the LR"],x:"Larger batches have lower gradient noise, so you can take larger steps."},
{m:"2B",c:"Algorithm",q:"Cosine annealing schedules the learning rate as:",a:"LR decreases following a cosine curve from max to min",d:["LR increases linearly","LR stays constant then drops","LR oscillates randomly"],x:"Smooth decay that spends more time at low LR. Often combined with warm restarts."},
{m:"2B",c:"Concept",q:"Residual/skip connections solve:",a:"Vanishing gradients — gradient flows directly through the skip path",d:["Overfitting","Slow data loading","Memory overflow"],x:"h(x) = f(x) + x. The identity shortcut ensures gradient >= 1 along the skip path."},

// ---- 2C: Regularization ----
{m:"2C",c:"Algorithm",q:"Dropout during training does what?",a:"Randomly zeroes out neurons with probability p at each forward pass",d:["Removes layers","Reduces learning rate","Clips gradients"],x:"Forces redundant representations. At test time, scale weights by (1-p) or use inverted dropout."},
{m:"2C",c:"Concept",q:"Early stopping is equivalent to what form of regularization?",a:"L2 regularization (approximately)",d:["L1","Dropout","Data augmentation"],x:"Stopping before convergence constrains the effective norm of the weights, similar to an L2 penalty."},
{m:"2C",c:"Concept",q:"The double descent phenomenon shows:",a:"Test error can decrease again after the interpolation threshold as model grows larger",d:["Error always increases with complexity","Error plateaus after overfitting","Training error goes to zero then increases"],x:"Classical U-shaped curve is incomplete — very large models generalize well again. Challenges traditional bias-variance."},
{m:"2C",c:"Concept",q:"Label smoothing replaces hard labels [0,1] with:",a:"Soft targets like [0.05, 0.95] to prevent overconfident predictions",d:["Random labels","Averaged labels","Reversed labels"],x:"Prevents the model from becoming too confident, improving calibration and generalization."},
{m:"2C",c:"Concept",q:"The Lottery Ticket Hypothesis states:",a:"Dense networks contain sparse subnetworks that can train to full accuracy alone",d:["All weights are equally important","Pruning always hurts","Random initialization doesn't matter"],x:"'Winning tickets' are subnetworks whose initialization enables successful training."},

// ---- 2D: CNNs ----
{m:"2D",c:"Concept",q:"CNNs (Convolutional Neural Networks) exploit what two properties of images?",a:"Translation invariance (shared weights) and locality (small receptive fields)",d:["Color and brightness","Resolution and aspect ratio","Compression and encoding"],x:"Convolution with shared filters detects the same pattern anywhere. Small kernels capture local structure."},
{m:"2D",c:"Algorithm",q:"What does a convolutional filter detect?",a:"A local spatial pattern (edge, texture, etc.) via learned weights",d:["Global image statistics","Color histograms","Pixel coordinates"],x:"Early layers detect edges, middle layers textures/parts, deep layers objects."},
{m:"2D",c:"Concept",q:"ResNet's key insight was:",a:"Skip connections enable training very deep networks (100+ layers)",d:["Wider layers are better","Pooling is unnecessary","Smaller kernels are always better"],x:"Without skip connections, gradients vanish in deep nets. Residual learning: learn f(x) = h(x) - x instead."},
{m:"2D",c:"Algorithm",q:"Transfer learning's two main strategies:",a:"Feature extraction (freeze base) and fine-tuning (unfreeze and train)",d:["Train from scratch both times","Only use pretrained weights","Only train the first layer"],x:"Feature extraction: new head on frozen backbone. Fine-tuning: unfreeze some layers, low LR."},
{m:"2D",c:"Concept",q:"The receptive field of a neuron in a CNN (Convolutional Neural Network) is:",a:"The region of the input image that influences that neuron's output",d:["The size of the filter","The number of channels","The activation function"],x:"Deeper layers have larger receptive fields. Stacked 3x3 convolutions build up a large receptive field efficiently."},

// ---- 2E: Sequence Models ----
{m:"2E",c:"Concept",q:"The fundamental problem of vanilla RNNs (Recurrent Neural Networks):",a:"Vanishing/exploding gradients over long sequences",d:["Too many parameters","Can't handle variable length","Slow inference"],x:"Gradients multiply through many time steps — exponential decay or growth. LSTMs solve this."},
{m:"2E",c:"Algorithm",q:"LSTM (Long Short-Term Memory) cell state acts as:",a:"A highway for gradient flow — information persists with minimal transformation",d:["An activation function","A loss accumulator","A learning rate scheduler"],x:"The cell state runs through with only addition and element-wise gating, preserving long-range gradients."},
{m:"2E",c:"Algorithm",q:"LSTM (Long Short-Term Memory) has three gates:",a:"Forget gate, input gate, output gate",d:["Read, write, execute","Encode, decode, attend","Add, multiply, normalize"],x:"Forget: what to discard. Input: what new info to store. Output: what to expose as hidden state."},
{m:"2E",c:"Algorithm",q:"GRU (Gated Recurrent Unit) simplifies LSTM by:",a:"Combining forget and input gates into one update gate (2 gates total)",d:["Removing all gates","Adding a fourth gate","Using convolution"],x:"GRU has reset and update gates. Similar performance to LSTM with fewer parameters."},
{m:"2E",c:"Concept",q:"Seq2seq models suffer from what bottleneck?",a:"The entire input is compressed into a single fixed-length vector",d:["Too many decoder layers","Vocabulary size","Training data size"],x:"Motivates attention: let the decoder look at all encoder states, not just the final one."},

// ---- 3A: Transformers ----
{m:"3A",c:"Equation",q:"Scaled dot-product attention formula:",a:"Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) V",d:["softmax(QV^T / d_k) K","sigmoid(QK^T) V","Q^T K V / n"],x:"Division by sqrt(d_k) prevents softmax saturation for large d_k."},
{m:"3A",c:"Concept",q:"Why use multi-head attention instead of single-head?",a:"Different heads attend to different relationship types in parallel",d:["Reduces parameters","Eliminates positional encoding","Faster than single head"],x:"Head 1 might capture syntax, head 2 semantics, etc. Concat and project."},
{m:"3A",c:"Concept",q:"Why do Transformers need positional encoding?",a:"Self-attention is permutation-invariant — no inherent notion of order",d:["To reduce parameters","To handle variable-length input","To normalize activations"],x:"Without position info, 'dog bites man' = 'man bites dog' to the model.",w:{"To handle variable-length input":"Transformers already handle variable length via padding/masking. Positional encoding adds ORDER information, not length handling.","To normalize activations":"Layer norm handles activation normalization. Positional encoding injects sequence position so the model knows which token comes first, second, etc."}},
{m:"3A",c:"Algorithm",q:"Transformer decoder uses masked self-attention to:",a:"Prevent attending to future tokens during generation",d:["Speed up training","Reduce memory","Handle missing data"],x:"Causal mask: position i can only attend to positions <= i. Ensures autoregressive generation."},
{m:"3A",c:"Concept",q:"The position-wise FFN (Feed-Forward Network) in each Transformer block does:",a:"Applies the same 2-layer MLP (Multi-Layer Perceptron) independently to each position",d:["Convolves across positions","Attends to neighboring tokens","Pools over the sequence"],x:"expand -> ReLU/GELU -> project back. Same weights at every position; no cross-position interaction."},

// ---- 3B: Generative Models ----
{m:"3B",c:"Concept",q:"VAE (Variational Autoencoder) loss function (ELBO) has two terms:",a:"Reconstruction loss + KL (Kullback-Leibler) divergence from prior",d:["MSE + accuracy","Hinge loss + entropy","Cross-entropy + L2"],x:"Reconstruction = faithful output. KL = keep latent distribution close to N(0,I)."},
{m:"3B",c:"Concept",q:"Why do VAEs (Variational Autoencoders) produce blurry images?",a:"Reconstruction loss (MSE) averages over plausible outputs",d:["Too few latent dimensions","Wrong activation function","Not enough training data"],x:"When multiple sharp images are plausible, minimizing MSE produces their blurry average."},
{m:"3B",c:"Algorithm",q:"The reparameterization trick enables:",a:"Backpropagation through stochastic sampling: z = mu + sigma * epsilon",d:["Faster training","Larger batch sizes","Better initialization"],x:"Can't backprop through random sampling. Rewrite z so randomness (epsilon~N(0,1)) is external."},
{m:"3B",c:"Concept",q:"GANs (Generative Adversarial Networks) suffer from mode collapse — what is it?",a:"Generator produces only a few modes of the data, ignoring diversity",d:["Discriminator always wins","Training is too slow","Loss goes to infinity"],x:"Generator finds a few outputs that fool the discriminator and stops exploring."},
{m:"3B",c:"Algorithm",q:"Diffusion models learn to:",a:"Reverse a gradual noise-corruption process (denoise step by step)",d:["Encode images to latent space","Adversarially fool a critic","Maximize likelihood directly"],x:"Forward: add noise over T steps. Reverse: neural net predicts and removes noise at each step."},

// ---- 3C: Self-Supervised Learning ----
{m:"3C",c:"Algorithm",q:"GPT (Generative Pre-trained Transformer) pretraining objective:",a:"Autoregressive next-token prediction (causal language modeling)",d:["Masked language modeling","Image classification","Contrastive learning"],x:"Predict the next token given all previous tokens. Causal mask prevents looking ahead."},
{m:"3C",c:"Algorithm",q:"BERT (Bidirectional Encoder Representations from Transformers) pretraining objective:",a:"Masked language modeling — predict randomly masked tokens bidirectionally",d:["Next-token prediction","Image-text matching","Reinforcement learning"],x:"Mask 15% of tokens (80% [MASK], 10% random, 10% unchanged). Bidirectional context."},
{m:"3C",c:"Algorithm",q:"SimCLR contrastive learning works by:",a:"Pulling augmented views of same image together, pushing different images apart",d:["Predicting rotation angle","Colorizing grayscale images","Generating image captions"],x:"Two augmentations of same image = positive pair. All other images in batch = negatives. NT-Xent loss."},
{m:"3C",c:"Concept",q:"Why does scale matter so much for GPT (Generative Pre-trained Transformer) models?",a:"Emergent capabilities appear at sufficient scale (in-context learning, reasoning)",d:["Smaller models can't converge","Architecture doesn't matter","Only data quality matters"],x:"Scaling laws show predictable improvement with more compute, data, and parameters."},

// ---- 3D: Reinforcement Learning ----
{m:"3D",c:"Equation",q:"Bellman equation for state-value V^pi(s):",a:"V(s) = E[R + gamma * V(s') | s, pi]",d:["V(s) = max R","V(s) = sum P(s'|s)","V(s) = R / gamma"],x:"Value = immediate reward + discounted future value. Foundation of all RL (Reinforcement Learning) algorithms."},
{m:"3D",c:"Concept",q:"Exploration vs exploitation tradeoff:",a:"Try new actions (explore) vs use best known action (exploit)",d:["Training vs testing","Online vs offline","Model vs data"],x:"Too much exploitation = miss better options. Too much exploration = waste time."},
{m:"3D",c:"Algorithm",q:"Q-Learning is off-policy because:",a:"It updates using the max Q over next actions, regardless of the policy actually followed",d:["It uses a replay buffer","It trains offline","It has no policy"],x:"Target: R + gamma * max_a' Q(s',a'). The max makes it learn the optimal policy regardless of behavior."},
{m:"3D",c:"Algorithm",q:"REINFORCE algorithm estimates policy gradient using:",a:"Monte Carlo returns as the reward signal (complete episode rollouts)",d:["Temporal difference errors","Dynamic programming","Supervised labels"],x:"Gradient = E[sum(grad log pi(a|s) * G_t)]. High variance — that's why baselines help."},
{m:"3D",c:"Concept",q:"Discount factor gamma's role:",a:"Controls how much the agent values future vs immediate rewards",d:["Sets the learning rate","Determines episode length","Controls exploration"],x:"gamma=0: greedy (only immediate). gamma=1: far-sighted (all future rewards equal)."},

// ---- 4A: NLP ----
{m:"4A",c:"Algorithm",q:"BPE (Byte Pair Encoding) tokenization works by:",a:"Iteratively merging the most frequent adjacent character pairs",d:["Splitting on whitespace","Using a dictionary lookup","Character-level encoding only"],x:"Start with characters, greedily merge frequent pairs. Handles rare/unseen words via subwords."},
{m:"4A",c:"Concept",q:"Word2Vec's skip-gram objective:",a:"Predict context words given the center word",d:["Predict center word from context","Classify word sentiment","Translate between languages"],x:"Learns embeddings where similar words have similar vectors. 'king - man + woman ~ queen'."},
{m:"4A",c:"Metric",q:"Perplexity measures:",a:"How surprised the model is by the test data (lower = better)",d:["Model size","Training speed","Vocabulary coverage"],x:"PPL (Perplexity) = 2^(cross-entropy). A model with PPL=50 is as uncertain as choosing uniformly from 50 words."},
{m:"4A",c:"Algorithm",q:"RLHF (Reinforcement Learning from Human Feedback) does:",a:"Fine-tunes LLM using a reward model trained on human preference rankings",d:["Trains from scratch with RL","Replaces all supervised training","Only works for games"],x:"SFT (Supervised Fine-Tuning) -> train reward model on preferences -> optimize policy with PPO against reward model."},
{m:"4A",c:"Algorithm",q:"Top-p (nucleus) sampling selects tokens from:",a:"The smallest set of tokens whose cumulative probability exceeds p",d:["The top p tokens by count","Random tokens with probability p","All tokens equally"],x:"Adapts vocabulary size dynamically. High probability = few tokens. Flat distribution = many tokens."},

// ---- 4B: Computer Vision ----
{m:"4B",c:"Algorithm",q:"YOLO (You Only Look Once) key innovation for object detection:",a:"Single-pass detection — predicts boxes and classes in one forward pass",d:["Uses multiple region proposals","Processes each pixel separately","Requires depth maps"],x:"Divide image into grid. Each cell predicts bounding boxes and class probabilities simultaneously."},
{m:"4B",c:"Algorithm",q:"U-Net's skip connections in segmentation:",a:"Concatenate encoder features with decoder at each level for fine detail",d:["Add residuals like ResNet","Pool features globally","Skip the decoder entirely"],x:"Encoder captures context, decoder needs fine spatial detail from encoder via skip connections."},
{m:"4B",c:"Metric",q:"IoU (Intersection over Union) measures:",a:"Overlap between predicted and ground-truth bounding boxes",d:["Classification accuracy","Pixel brightness","Feature similarity"],x:"IoU = Area(intersection) / Area(union). IoU > 0.5 typically counts as a correct detection."},
{m:"4B",c:"Algorithm",q:"Vision Transformer (ViT) processes images by:",a:"Splitting into patches, embedding them, then applying standard Transformer",d:["Using convolutional layers only","Processing pixel by pixel","Generating image captions"],x:"16x16 patches become tokens. Position embeddings added. Self-attention over patches."},
{m:"4B",c:"Concept",q:"Dilated (atrous) convolutions in DeepLab enable:",a:"Larger receptive fields without reducing resolution or adding parameters",d:["Faster training","Better color detection","Smaller model size"],x:"Insert gaps between kernel elements. Dilation rate 2 on a 3x3 kernel covers a 5x5 area."},

// ---- 4C: Advanced RL ----
{m:"4C",c:"Algorithm",q:"PPO (Proximal Policy Optimization) clipped objective prevents:",a:"Destructively large policy updates",d:["Vanishing gradients","Overfitting to reward","Memory overflow"],x:"Clips the probability ratio to [1-epsilon, 1+epsilon], keeping updates conservative."},
{m:"4C",c:"Algorithm",q:"AlphaZero learns to play games by:",a:"Self-play from scratch + MCTS (Monte Carlo Tree Search) guided by a neural network",d:["Imitating human games only","Brute-force search","Random play"],x:"Neural net evaluates positions and guides search. Self-play generates training data. No human games needed."},
{m:"4C",c:"Concept",q:"Offline RL (Reinforcement Learning) main challenge:",a:"Distribution shift — policy visits states not in the static dataset",d:["Too much exploration","Slow training","No reward signal"],x:"The learned policy may try actions never seen in data, where Q-estimates are unreliable."},
{m:"4C",c:"Algorithm",q:"Decision Transformers reframe RL (Reinforcement Learning) as:",a:"Sequence modeling — predict actions conditioned on desired return",d:["Classification","Density estimation","Graph search"],x:"Input: (return-to-go, state, action) sequences. Transformer predicts next action given desired future return."},
{m:"4C",c:"Concept",q:"Model-based RL (Reinforcement Learning) advantage and risk:",a:"More sample-efficient, but compounding model errors can diverge",d:["Always better than model-free","No hyperparameters","Guaranteed convergence"],x:"Learning a world model means fewer real interactions, but errors in the model accumulate over long rollouts."},

// ---- 4D: Bayesian ML ----
{m:"4D",c:"Equation",q:"Bayes' theorem in ML: posterior =",a:"likelihood * prior / marginal likelihood",d:["prior / likelihood","likelihood - prior","prior + evidence"],x:"P(w|D) = P(D|w)P(w) / P(D). The foundation of all Bayesian inference."},
{m:"4D",c:"Concept",q:"MAP (Maximum A Posteriori) estimation is Bayesian with what simplification?",a:"Point estimate at the posterior mode instead of the full posterior",d:["Uniform prior","No likelihood","Infinite data"],x:"MAP = argmax P(w|D). With Gaussian prior, MAP = Ridge regression. Loses uncertainty quantification."},
{m:"4D",c:"Algorithm",q:"Gaussian Processes define a distribution over:",a:"Functions — any finite set of points is jointly Gaussian",d:["Parameters","Data points","Loss surfaces"],x:"Specified by mean function and kernel. Prior over functions -> posterior after seeing data."},
{m:"4D",c:"Concept",q:"MC (Monte Carlo) Dropout approximates:",a:"Bayesian inference — dropout at test time gives uncertainty estimates",d:["Data augmentation","Feature selection","Model pruning"],x:"Run multiple forward passes with dropout on. Variance of predictions ~ epistemic uncertainty."},
{m:"4D",c:"Algorithm",q:"HMC (Hamiltonian Monte Carlo) improves on Metropolis-Hastings by:",a:"Using gradient information to propose distant, high-probability samples",d:["Not requiring a proposal distribution","Running faster on GPUs","Using fewer samples"],x:"Simulates Hamiltonian dynamics on the posterior surface. Much more efficient in high dimensions."},

function reviewLink(mod){
  const slug=MOD_URL[mod];
  if(!slug)return "";
  const modInfo=PARTS.flatMap(p=>p.mods).find(m=>m.id===mod);
  const name=modInfo?modInfo.name:mod;
  return `<a class="review-link" href="./${slug}/" target="_blank">Review: ${mod} — ${name}</a>`;
}

// ===================== STATE =====================
let gScore=0, gStreak=0, gBest=0;
let curMode="quiz", curMod=null, curPart=null;
let used=new Set(), timer=null;

const app=document.getElementById("app");
const $=s=>document.querySelector(s);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function updateStats(){$("#globalScore").textContent=gScore;$("#globalStreak").textContent=gStreak;$("#globalBest").textContent=gBest;}
function pool(arr,mod){return mod?arr.filter(q=>q.m===mod):arr;}
function partMods(pid){return PARTS.find(p=>p.id===pid)?.mods.map(m=>m.id)||[];}
function poolPart(arr,pid){const ms=partMods(pid);return arr.filter(q=>ms.includes(q.m));}
function getPool(arr){if(curMod) return pool(arr,curMod);if(curPart) return poolPart(arr,curPart);return arr;}

document.getElementById("navTitle").addEventListener("click",()=>{curMod=null;curPart=null;used.clear();clearInterval(timer);showHome();});

// ===================== HOME =====================
function showHome(){
  let h=`<div class="home"><div class="home-header"><h2>Choose Your Arena</h2><p>Pick a part, module, or go all-in</p></div>`;
  h+=`<div class="mode-row">${MODES.map(m=>`<button class="mode-pill${curMode===m.id?" active":""}" data-m="${m.id}">${m.label}</button>`).join("")}</div>`;
  h+=`<div class="part-grid">`;
  for(const p of PARTS){
    const nq=poolPart(Q,p.id).length+poolPart(TF,p.id).length;
    h+=`<div class="part-card p${p.id}" data-p="${p.id}">
      <div class="part-num">Part ${p.id}</div><h3>${p.name}</h3>
      <div class="modules">${p.mods.map(m=>m.id+": "+m.name).join("<br>")}</div>
      <div class="progress-pip">${nq} questions</div></div>`;
  }
  h+=`</div>`;
  h+=`<div style="text-align:center"><button class="all-btn" id="allBtn" style="max-width:400px">Play All Parts (${Q.length+TF.length} questions)</button></div>`;
  h+=`</div>`;
  app.innerHTML=h;

  app.querySelectorAll(".mode-pill").forEach(b=>b.addEventListener("click",()=>{
    curMode=b.dataset.m;app.querySelectorAll(".mode-pill").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  }));
  app.querySelectorAll(".part-card").forEach(c=>c.addEventListener("click",()=>{curPart=c.dataset.p;curMod=null;used.clear();showModulePicker();}));
  $("#allBtn").addEventListener("click",()=>{curPart=null;curMod=null;used.clear();startMode();});
}

function showModulePicker(){
  const p=PARTS.find(x=>x.id===curPart);
  let h=`<div class="module-picker"><span class="back-link" id="backHome">&larr; Back</span>`;
  h+=`<h2>Part ${p.id}: ${p.name}</h2><p class="sub">Pick a module or study the whole part</p>`;
  h+=`<div class="mod-list">`;
  for(const m of p.mods){
    const nq=pool(Q,m.id).length+pool(TF,m.id).length;
    h+=`<div class="mod-item" data-mod="${m.id}"><div class="mi-left"><div class="mi-code" style="color:var(--${p.color})">${m.id}</div><div class="mi-title">${m.name}</div></div><div class="mi-count">${nq} items</div></div>`;
  }
  h+=`</div>`;
  const total=poolPart(Q,p.id).length+poolPart(TF,p.id).length;
  h+=`<button class="all-btn" id="partAll">All of Part ${p.id} (${total} items)</button>`;
  h+=`</div>`;
  app.innerHTML=h;
  $("#backHome").addEventListener("click",()=>{curPart=null;showHome();});
  app.querySelectorAll(".mod-item").forEach(el=>el.addEventListener("click",()=>{curMod=el.dataset.mod;used.clear();startMode();}));
  $("#partAll").addEventListener("click",()=>{curMod=null;used.clear();startMode();});
}

function startMode(){
  if(curMode==="quiz") runQuiz();
  else if(curMode==="tf") runTF();
  else if(curMode==="match") runMatch();
  else if(curMode==="speed") runSpeed();
  else if(curMode==="flash") runFlash();
  else if(curMode==="sheet") runSheet();
}

function header(){
  const label=curMod||(curPart?"Part "+curPart:"All");
  return `<span class="back-link" id="backNav">&larr; ${curPart?"Modules":"Home"}</span>`;
}
function bindBack(){
  const b=$("#backNav");if(!b)return;
  b.addEventListener("click",()=>{clearInterval(timer);used.clear();if(curMod&&curPart){curMod=null;showModulePicker();}else{curPart=null;curMod=null;showHome();}});
}

// ===================== QUIZ =====================
let qScore=0,qTotal=0,qQueue=[];
function runQuiz(){qScore=0;qTotal=0;qQueue=shuffle(getPool(Q));nextQuiz();}
function nextQuiz(){
  if(!qQueue.length){showSummary(qScore,qTotal);return;}
  const q=qQueue.shift();
  const opts=shuffle([q.a,...q.d]);
  qTotal++;
  const qTotalAll=qTotal+qQueue.length;
  let h=`<div class="game-wrap">${header()}
    <div class="score-bar"><div class="sb-left"><span class="sc">Score: ${qScore}/${qTotal-1}</span><span class="st">Streak: ${gStreak}</span></div><div class="sb-right">${qTotal}/${qTotalAll}</div></div>
    <div class="q-card"><div class="q-cat">${q.m} — ${q.c}</div><div class="q-text">${q.q}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-a="${o===q.a?1:0}">${o}</button>`).join("")}</div>
    <div class="expl" id="expl">${q.x}</div></div><button class="nxt" id="nxt">Next</button></div>`;
  app.innerHTML=h;bindBack();
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("lk"))return;
    app.querySelectorAll(".opt").forEach(o=>{o.classList.add("lk");if(o.dataset.a==="1")o.classList.add("ok");});
    const expl=$("#expl");
    const rl=reviewLink(q.m);
    if(b.dataset.a==="1"){
      qScore++;gScore++;gStreak++;if(gStreak>gBest)gBest=gStreak;
      expl.classList.add("right");
      expl.innerHTML=`<div class="expl-label green">Correct</div>${q.x}<br>${rl}`;
    } else {
      b.classList.add("no");gStreak=0;
      const picked=b.textContent;
      const wrongNote=q.w&&q.w[picked]?`<div class="expl-picked">"${picked}" — ${q.w[picked]}</div>`
        :`<div class="expl-picked">You picked: "${picked}"</div>`;
      expl.classList.add("wrong");
      expl.innerHTML=`<div class="expl-label red">Incorrect</div>
        <div class="expl-correct">Correct answer: ${q.a}</div>
        ${wrongNote}
        <div class="expl-why">${q.x}</div>${rl}`;
    }
    updateStats();$(".sc").textContent=`Score: ${qScore}/${qTotal}`;$(".st").textContent=`Streak: ${gStreak}`;
    expl.classList.add("show");$("#nxt").classList.add("show");
  }));
  $("#nxt").addEventListener("click",nextQuiz);
}

let tfScore=0,tfTotal=0,tfQueue=[];
function runTF(){tfScore=0;tfTotal=0;tfQueue=shuffle(getPool(TF));nextTF();}
function nextTF(){
  if(!tfQueue.length){showSummary(tfScore,tfTotal);return;}
  const q=tfQueue.shift();tfTotal++;
  const tfTotalAll=tfTotal+tfQueue.length;
  let h=`<div class="game-wrap">${header()}
    <div class="score-bar"><div class="sb-left"><span class="sc">Score: ${tfScore}/${tfTotal-1}</span><span class="st">Streak: ${gStreak}</span></div><div class="sb-right">${tfTotal}/${tfTotalAll}</div></div>
    <div class="q-card"><div class="q-cat">${q.m} — True or False</div><div class="q-text">${q.q}</div>
    <div class="opts"><button class="opt" data-v="true">True</button><button class="opt" data-v="false">False</button></div>
    <div class="expl" id="expl">${q.x}</div></div><button class="nxt" id="nxt">Next</button></div>`;
  app.innerHTML=h;bindBack();
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("lk"))return;
    const picked=b.dataset.v==="true";
    app.querySelectorAll(".opt").forEach(o=>{o.classList.add("lk");if((o.dataset.v==="true")===q.a)o.classList.add("ok");});
    const expl=$("#expl");
    const rl=reviewLink(q.m);
    if(picked===q.a){
      tfScore++;gScore++;gStreak++;if(gStreak>gBest)gBest=gStreak;
      expl.classList.add("right");
      expl.innerHTML=`<div class="expl-label green">Correct — ${q.a?"True":"False"}</div>${q.x}<br>${rl}`;
    } else {
      b.classList.add("no");gStreak=0;
      expl.classList.add("wrong");
      expl.innerHTML=`<div class="expl-label red">Incorrect — The answer is ${q.a?"True":"False"}</div>
        <div class="expl-why">${q.x}</div>${rl}`;
    }
    updateStats();$(".sc").textContent=`Score: ${tfScore}/${tfTotal}`;$(".st").textContent=`Streak: ${gStreak}`;
    expl.classList.add("show");$("#nxt").classList.add("show");
  }));
  $("#nxt").addEventListener("click",nextTF);
}

function nextMatch(){
  if(!mQueue.length){showSummary(mScore,mSets,true);return;}
  const m=mQueue.shift();mSets++;
  const mTotalAll=mSets+mQueue.length;
  const ls=shuffle(m.p.map(x=>x[0])),rs=shuffle(m.p.map(x=>x[1]));

  let sel=null,matched=0;
  let h=`<div class="game-wrap">${header()}

    <div class="q-card"><div class="q-cat">${m.m} — Matching</div><div class="q-text">${m.t}</div>
    <div class="match-grid"><div class="match-col"><h4>Terms</h4>${ls.map(l=>`<div class="mi2 left" data-v="${l}">${l}</div>`).join("")}</div>
    <div class="match-col"><h4>Definitions</h4>${rs.map(r=>`<div class="mi2 right" data-v="${r}">${r}</div>`).join("")}</div></div></div>
    <button class="nxt" id="nxt">Next Set</button></div>`;
  app.innerHTML=h;bindBack();
  app.querySelectorAll(".mi2").forEach(el=>el.addEventListener("click",()=>{
    if(el.classList.contains("done"))return;
    const isL=el.classList.contains("left");
    if(!sel){el.classList.add("sel");sel={el,isL,v:el.dataset.v};return;}
    if(sel.isL===isL){sel.el.classList.remove("sel");el.classList.add("sel");sel={el,isL,v:el.dataset.v};return;}
    const left=isL?el.dataset.v:sel.v,right=isL?sel.v:el.dataset.v;
    const lEl=isL?el:sel.el,rEl=isL?sel.el:el;
    if(correct[left]===right){
      lEl.classList.remove("sel");lEl.classList.add("done");rEl.classList.remove("sel");rEl.classList.add("done");
      matched++;mScore++;gScore++;gStreak++;if(gStreak>gBest)gBest=gStreak;updateStats();
      $(".sc").textContent=`Matched: ${matched}/${m.p.length}`;
      if(matched===m.p.length)$("#nxt").classList.add("show");
    }else{
      lEl.classList.add("flash");rEl.classList.add("flash");gStreak=0;updateStats();
      setTimeout(()=>{lEl.classList.remove("flash","sel");rEl.classList.remove("flash","sel");},400);
    }
    sel=null;
  }));
  $("#nxt").addEventListener("click",nextMatch);
}

// ===================== SPEED =====================
let sScore=0,sTotal=0,sQueue=[];
function runSpeed(){sScore=0;sTotal=0;sQueue=shuffle(getPool(Q));nextSpeed();}
function nextSpeed(){
  if(!sQueue.length){showSummary(sScore,sTotal);return;}
  const q=sQueue.shift();const opts=shuffle([q.a,...q.d]);sTotal++;
  const sTotalAll=sTotal+sQueue.length;
  let tLeft=12000,done=false;
  let h=`<div class="game-wrap">${header()}
    <div class="score-bar"><div class="sb-left"><span class="sc">Score: ${sScore}/${sTotal-1}</span><span class="st">Streak: ${gStreak}</span></div><div class="sb-right">${sTotal}/${sTotalAll}</div></div>
    <div class="timer-bar"><div class="timer-fill" id="tf2" style="width:100%"></div></div>
    <div class="q-card"><div class="q-cat">${q.m} — ${q.c} (SPEED)</div><div class="q-text">${q.q}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-a="${o===q.a?1:0}">${o}</button>`).join("")}</div>
    <div class="expl" id="expl">${q.x}</div></div><button class="nxt" id="nxt">Next</button></div>`;
  app.innerHTML=h;bindBack();
  const fill=$("#tf2");
  clearInterval(timer);
  timer=setInterval(()=>{
    if(done)return;tLeft-=40;const pct=Math.max(0,tLeft/12000*100);
    fill.style.width=pct+"%";if(pct<25)fill.classList.add("danger");
    if(tLeft<=0){done=true;clearInterval(timer);gStreak=0;updateStats();
      app.querySelectorAll(".opt").forEach(o=>{o.classList.add("lk");if(o.dataset.a==="1")o.classList.add("ok");});
      $(".sc").textContent=`Score: ${sScore}/${sTotal}`;$(".st").textContent=`Streak: ${gStreak}`;
      const expl=$("#expl");expl.classList.add("wrong");
      expl.innerHTML=`<div class="expl-label red">Time's up!</div>
        <div class="expl-correct">Correct answer: ${q.a}</div>
        <div class="expl-why">${q.x}</div>${reviewLink(q.m)}`;
      expl.classList.add("show");$("#nxt").classList.add("show");}
  },40);
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(done)return;done=true;clearInterval(timer);
    app.querySelectorAll(".opt").forEach(o=>{o.classList.add("lk");if(o.dataset.a==="1")o.classList.add("ok");});
    const expl=$("#expl");
    const rl=reviewLink(q.m);
    if(b.dataset.a==="1"){
      sScore++;gScore++;gStreak++;if(gStreak>gBest)gBest=gStreak;
      expl.classList.add("right");
      expl.innerHTML=`<div class="expl-label green">Correct</div>${q.x}<br>${rl}`;
    } else {
      b.classList.add("no");gStreak=0;
      const picked=b.textContent;
      const wrongNote=q.w&&q.w[picked]?`<div class="expl-picked">"${picked}" — ${q.w[picked]}</div>`
        :`<div class="expl-picked">You picked: "${picked}"</div>`;
      expl.classList.add("wrong");
      expl.innerHTML=`<div class="expl-label red">Incorrect</div>
        <div class="expl-correct">Correct answer: ${q.a}</div>
        ${wrongNote}
        <div class="expl-why">${q.x}</div>${rl}`;
    }
    updateStats();$(".sc").textContent=`Score: ${sScore}/${sTotal}`;$(".st").textContent=`Streak: ${gStreak}`;
    expl.classList.add("show");$("#nxt").classList.add("show");
  }));
  $("#nxt").addEventListener("click",nextSpeed);
}

// ===================== FLASHCARDS =====================
function runFlash(){
  const cards=shuffle(getPool(FC));
  let idx=0;
  function render(){
    const c=cards[idx];
    let h=`<div class="game-wrap">${header()}
      <div class="score-bar"><div class="sb-left"><span>${curMod||curPart?"Module "+( curMod||"Part "+curPart):"All"}</span></div><div class="sb-right">${cards.length} cards</div></div>
      <div class="fc-card" id="fcCard"><div class="fc-inner">
        <div class="fc-front"><div class="fc-label">${c.m}</div><div class="fc-q">${c.front}</div><div class="fc-hint">Click to flip</div></div>
        <div class="fc-back"><div class="fc-a">${c.back.replace(/\n/g,"<br>")}</div></div>
      </div></div>
      <div class="fc-nav"><button id="fcPrev">&larr; Prev</button><div class="fc-count">${idx+1} / ${cards.length}</div><button id="fcNext">Next &rarr;</button></div>
      <div class="fc-rate"><button class="fc-hard" id="fcH">Hard</button><button class="fc-ok" id="fcO">OK</button><button class="fc-easy" id="fcE">Easy</button></div>
    </div>`;
    app.innerHTML=h;bindBack();
    $("#fcCard").addEventListener("click",()=>$("#fcCard").classList.toggle("flipped"));
    $("#fcPrev").addEventListener("click",()=>{if(idx>0){idx--;render();}});
    $("#fcNext").addEventListener("click",()=>{if(idx<cards.length-1){idx++;render();}});
    $("#fcH").addEventListener("click",()=>{/* could track */if(idx<cards.length-1){idx++;render();}});
    $("#fcO").addEventListener("click",()=>{if(idx<cards.length-1){idx++;render();}});
    $("#fcE").addEventListener("click",()=>{if(idx<cards.length-1){idx++;render();}});
  }
  render();
}

// ===================== CHEAT SHEET =====================
function runSheet(){
  const mods=curMod?[curMod]:curPart?partMods(curPart):PARTS.flatMap(p=>p.mods.map(m=>m.id));
  const sections=[];
  for(const mid of mods){
    const qs=pool(Q,mid),tfs=pool(TF,mid);
    if(!qs.length&&!tfs.length)continue;
    const items=[];
    qs.forEach(q=>items.push(`<strong>${q.c}:</strong> ${q.q} &rarr; ${q.a}`));
    tfs.forEach(q=>items.push(`<strong>T/F:</strong> ${q.q} &rarr; <em>${q.a?"True":"False"}</em> — ${q.x}`));
    const modInfo=PARTS.flatMap(p=>p.mods).find(m=>m.id===mid);
    sections.push({id:mid,name:modInfo?.name||mid,items});
  }
  let h=`<div class="sheet">${header()}<h2>Cheat Sheet${curMod?" — "+curMod:curPart?" — Part "+curPart:""}</h2>`;
  for(const s of sections){
    h+=`<div class="sheet-section"><h3>${s.id}: ${s.name}</h3><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  }
  h+=`</div>`;
  app.innerHTML=h;bindBack();
}

// ===================== SUMMARY =====================
function showSummary(sc,tot,isMatch=false){
  const pct=tot?Math.round(sc/tot*100):0;
  const grade=pct>=90?"Excellent":pct>=75?"Great":pct>=60?"Good":"Keep studying";
  const colors=pct>=90?"var(--green)":pct>=75?"var(--blue)":pct>=60?"var(--yellow)":"var(--red)";
  let h=`<div class="game-wrap"><div class="summary">
    <h2>Round Complete</h2>
    <div class="big" style="color:${colors}">${pct}%</div>
    <div class="detail">${sc} / ${tot} correct${isMatch?" pairs":""}</div>
    <div class="detail">Best streak: ${gBest}</div>
    <div class="grade">${grade}</div>
    <button class="restart" id="retry">Play Again</button>
    <button class="restart" id="goHome">Home</button>
  </div></div>`;
  app.innerHTML=h;
  $("#retry").addEventListener("click",()=>{used.clear();startMode();});
  $("#goHome").addEventListener("click",()=>{curPart=null;curMod=null;used.clear();showHome();});
}

// ===================== INIT =====================
showHome();
