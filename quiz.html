<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Course — Complete Study Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --blue: #38bdf8; --green: #34d399; --red: #f87171; --yellow: #fbbf24;
    --purple: #a78bfa; --pink: #f472b6; --orange: #fb923c; --cyan: #22d3ee;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--blue); text-decoration: none; }

  /* NAV */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--surface2); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 1.2rem; color: var(--blue); }
  .topbar .stats { display: flex; gap: 1.2rem; font-size: 0.85rem; color: var(--muted); }
  .topbar .stats span { display: flex; align-items: center; gap: 0.3rem; }
  .topbar .stats .val { color: var(--green); font-weight: 600; }

  /* HOME */
  .home { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .home-header { text-align: center; margin-bottom: 2rem; }
  .home-header h2 { font-size: 2rem; margin-bottom: 0.5rem; }
  .home-header p { color: var(--muted); }

  .part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .part-card { background: var(--surface); border: 2px solid var(--surface2); border-radius: 12px; padding: 1.3rem;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .part-card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .part-card .part-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.4rem; font-weight: 600; }
  .part-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  .part-card .modules { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .part-card .progress-pip { position: absolute; top: 1rem; right: 1rem; font-size: 0.75rem; color: var(--dim);
    background: var(--bg); padding: 0.2rem 0.5rem; border-radius: 4px; }
  .p1 .part-num { color: var(--blue); } .p1:hover { border-color: var(--blue); }
  .p2 .part-num { color: var(--purple); } .p2:hover { border-color: var(--purple); }
  .p3 .part-num { color: var(--pink); } .p3:hover { border-color: var(--pink); }
  .p4 .part-num { color: var(--orange); } .p4:hover { border-color: var(--orange); }
  .p5 .part-num { color: var(--cyan); } .p5:hover { border-color: var(--cyan); }

  .mode-row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
  .mode-pill { padding: 0.5rem 1.1rem; border: 2px solid var(--surface2); border-radius: 99px; background: var(--surface);
    color: var(--muted); cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
  .mode-pill:hover, .mode-pill.active { border-color: var(--blue); color: var(--blue); }

  /* MODULE PICKER */
  .module-picker { max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem; }
  .module-picker h2 { margin-bottom: 0.3rem; }
  .module-picker .sub { color: var(--muted); margin-bottom: 1.5rem; }
  .mod-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .mod-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem;
    background: var(--surface); border: 2px solid var(--surface2); border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .mod-item:hover { border-color: var(--blue); }
  .mod-item .mi-left { }
  .mod-item .mi-code { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .mod-item .mi-title { font-size: 1rem; }
  .mod-item .mi-count { font-size: 0.8rem; color: var(--dim); }
  .all-btn { margin-top: 0.8rem; padding: 0.8rem; text-align: center; background: var(--blue); color: var(--bg);
    font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 1rem; border: none; width: 100%; }
  .all-btn:hover { opacity: 0.9; }
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .back-link:hover { color: var(--blue); }

  /* GAME AREA */
  .game-wrap { max-width: 800px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
  .score-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem;
    background: var(--surface); border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
  .score-bar .sb-left { display: flex; gap: 1.2rem; }
  .score-bar .sc { color: var(--green); font-weight: 600; }
  .score-bar .st { color: var(--yellow); font-weight: 600; }
  .score-bar .sb-right { color: var(--dim); }

  .q-card { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .q-card .q-cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 0.5rem; }
  .q-card .q-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.2rem; }
  .q-card code { background: var(--surface2); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.88em; }

  .opts { display: grid; gap: 0.5rem; }
  .opt { padding: 0.75rem 1rem; border: 2px solid var(--surface2); border-radius: 8px; background: var(--bg);
    color: var(--text); cursor: pointer; font-size: 0.92rem; text-align: left; transition: all 0.12s; line-height: 1.4; }
  .opt:hover:not(.lk) { border-color: var(--dim); background: var(--surface); }
  .opt.ok { border-color: var(--green); background: #064e3b; color: #a7f3d0; }
  .opt.no { border-color: var(--red); background: #7f1d1d; color: #fca5a5; }
  .opt.lk { cursor: default; opacity: 0.55; }
  .opt.lk.ok { opacity: 1; }

  .expl { margin-top: 1rem; padding: 1rem; background: var(--surface2); border-radius: 8px;
    font-size: 0.88rem; line-height: 1.5; color: var(--text); display: none; }
  .expl.show { display: block; }
  .expl.wrong { border-left: 3px solid var(--red); }
  .expl.right { border-left: 3px solid var(--green); }
  .expl .expl-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; font-weight: 600; }
  .expl .expl-label.red { color: var(--red); }
  .expl .expl-label.green { color: var(--green); }
  .expl .expl-correct { color: var(--green); font-weight: 600; margin-bottom: 0.4rem; }
  .expl .expl-picked { color: var(--red); margin-bottom: 0.4rem; font-style: italic; }
  .expl .expl-why { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); color: var(--muted); }
  .expl .review-link { display: inline-block; margin-top: 0.7rem; padding: 0.35rem 0.8rem; border: 1px solid var(--blue);
    border-radius: 6px; font-size: 0.8rem; color: var(--blue); transition: all 0.15s; }
  .expl .review-link:hover { background: #1e3a5f; }

  .nxt { display: none; margin-top: 1rem; padding: 0.65rem 2rem; border: none; border-radius: 8px;
    background: var(--blue); color: var(--bg); font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .nxt:hover { opacity: 0.9; }
  .nxt.show { display: inline-block; }

  /* Timer */
  .timer-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--blue); transition: width 0.08s linear; }
  .timer-fill.danger { background: var(--red); }

  /* Matching */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .match-col { display: flex; flex-direction: column; gap: 0.5rem; }
  .match-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 0.2rem; }
  .mi2 { padding: 0.65rem 0.8rem; border: 2px solid var(--surface2); border-radius: 8px; background: var(--bg);
    cursor: pointer; font-size: 0.85rem; transition: all 0.12s; line-height: 1.3; }
  .mi2:hover:not(.done) { border-color: var(--dim); }
  .mi2.sel { border-color: var(--blue); background: #1e3a5f; }
  .mi2.done { border-color: var(--green); background: #064e3b; color: #a7f3d0; cursor: default; opacity: 0.7; }
  .mi2.flash { border-color: var(--red); background: #7f1d1d; }

  /* Flashcards */
  .fc-card { perspective: 800px; cursor: pointer; margin-bottom: 1rem; }
  .fc-inner { position: relative; width: 100%; min-height: 200px; transition: transform 0.5s; transform-style: preserve-3d; }
  .fc-card.flipped .fc-inner { transform: rotateY(180deg); }
  .fc-front, .fc-back { position: absolute; width: 100%; min-height: 200px; backface-visibility: hidden;
    border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .fc-front { background: var(--surface); border: 2px solid var(--surface2); }
  .fc-back { background: #1e3a5f; border: 2px solid var(--blue); transform: rotateY(180deg); }
  .fc-front .fc-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 0.8rem; }
  .fc-front .fc-q { font-size: 1.15rem; line-height: 1.5; }
  .fc-back .fc-a { font-size: 1.05rem; line-height: 1.5; }
  .fc-hint { font-size: 0.8rem; color: var(--dim); margin-top: 1rem; }
  .fc-nav { display: flex; gap: 0.8rem; justify-content: center; align-items: center; }
  .fc-nav button { padding: 0.5rem 1.5rem; border: 2px solid var(--surface2); border-radius: 8px;
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.9rem; }
  .fc-nav button:hover { border-color: var(--blue); }
  .fc-nav .fc-count { color: var(--dim); font-size: 0.85rem; min-width: 80px; text-align: center; }
  .fc-rate { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
  .fc-rate button { padding: 0.4rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .fc-rate .fc-hard { background: #7f1d1d; color: #fca5a5; }
  .fc-rate .fc-ok { background: #854d0e; color: #fde68a; }
  .fc-rate .fc-easy { background: #064e3b; color: #a7f3d0; }

  /* Summary */
  .summary { text-align: center; padding: 2rem; }
  .summary h2 { color: var(--blue); margin-bottom: 1rem; }
  .summary .big { font-size: 3.5rem; font-weight: 700; }
  .summary .detail { color: var(--muted); margin: 0.4rem 0; }
  .summary .grade { font-size: 1.2rem; margin: 1rem 0; }
  .restart { margin-top: 1rem; padding: 0.65rem 2rem; border: 2px solid var(--blue); border-radius: 8px;
    background: transparent; color: var(--blue); font-size: 0.95rem; cursor: pointer; margin-right: 0.5rem; }
  .restart:hover { background: #1e3a5f; }

  /* Cheat sheet */
  .sheet { max-width: 900px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
  .sheet h2 { margin-bottom: 1rem; }
  .sheet-section { background: var(--surface); border-radius: 10px; padding: 1.2rem; margin-bottom: 0.8rem; }
  .sheet-section h3 { font-size: 0.95rem; color: var(--blue); margin-bottom: 0.6rem; }
  .sheet-section ul { padding-left: 1.2rem; }
  .sheet-section li { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
  .sheet-section li strong { color: var(--text); }

  @media (max-width: 600px) {
    .match-grid { grid-template-columns: 1fr; }
    .part-grid { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; gap: 0.5rem; }
  }
</style>

<body>

<div class="topbar">
  <h1 id="navTitle" style="cursor:pointer">ML Study Tool</h1>
  <div class="stats">
    <span>Score: <span class="val" id="globalScore">0</span></span>
    <span>Streak: <span class="val" id="globalStreak">0</span></span>
    <span>Best: <span class="val" id="globalBest">0</span></span>
  </div>
</div>

<div id="app"></div>

<script>
// ===================== DATA =====================
const Q = [
// ---- 1B: Linear Regression ----
{m:"1B",c:"Equation",q:"What is the closed-form OLS (Ordinary Least Squares) solution?",a:"$\\mathbf{w}^* = (\\mathbf{X}^\\top \\mathbf{X})^{-1} \\mathbf{X}^\\top \\mathbf{y}$",d:["$\\mathbf{w}^* = \\mathbf{X}^\\top \\mathbf{y}$","$\\mathbf{w}^* = (\\mathbf{X}^\\top \\mathbf{X}) \\mathbf{X}^\\top \\mathbf{y}$","$\\mathbf{w}^* = \\mathbf{X} (\\mathbf{X}^\\top \\mathbf{X})^{-1} \\mathbf{y}$"],x:"Set gradient of $\\|\\mathbf{y} - \\mathbf{X}\\mathbf{w}\\|^2$ to zero and solve.",s:"2-ordinary-least-squares-ols"},
{m:"1B",c:"Concept",q:"What does the hat matrix $\\mathbf{H} = \\mathbf{X}(\\mathbf{X}^\\top \\mathbf{X})^{-1}\\mathbf{X}^\\top$ do?",a:"Projects y onto the column space of X",d:["Rotates y into feature space","Inverts the covariance","Normalizes residuals"],x:"$\\hat{y} = \\mathbf{H}\\mathbf{y}$ is the orthogonal projection of $\\mathbf{y}$ onto $\\text{Col}(\\mathbf{X})$.",s:"2-ordinary-least-squares-ols"},
{m:"1B",c:"Weakness",q:"Main weakness of OLS (Ordinary Least Squares) when p (features) is large?",a:"Overfitting and multicollinearity",d:["Underfitting","Slow gradient descent","Can't handle categoricals"],x:"When $p \\gg n$, OLS fits noise. Correlated features make $\\mathbf{X}^\\top \\mathbf{X}$ nearly singular.",s:"2-ordinary-least-squares-ols"},
{m:"1B",c:"Algorithm",q:"Ridge regression adds what penalty?",a:"$\\lambda \\|\\mathbf{w}\\|_2^2$ (squared L2 norm)",d:["$\\lambda \\|\\mathbf{w}\\|_1$ (L1 norm)","Constraint that w > 0","Extra bias term"],x:"Shrinks coefficients toward zero but never exactly to zero. Bayesian: Gaussian prior.",s:"7-regularization-controlling-complexity"},
{m:"1B",c:"Algorithm",q:"Which regularizer drives weights exactly to zero?",a:"Lasso (L1)",d:["Ridge (L2)","Elastic Net only","Polynomial"],x:"L1's diamond constraint has corners on axes, so solutions land at exact zeros.",s:"7-regularization-controlling-complexity"},
{m:"1B",c:"Concept",q:"Polynomial regression is still linear. Why?",a:"Linear in parameters w, nonlinear in x",d:["Uses linear activation","Features always independent","Only works on linear data"],x:"$\\phi(x)=[1, x, x^2, \\ldots]$ is nonlinear, but $y = \\mathbf{w}^\\top \\phi(x)$ is linear in $\\mathbf{w}$.",w:{"Only works on linear data":"It works on nonlinear data — that's the whole point. The features are nonlinear transforms of x.","Uses linear activation":"Activation functions are a neural network concept, not relevant to regression."},s:"6-polynomial-regression-and-basis-functions"},
{m:"1B",c:"Metric",q:"$R^2 = 0.85$ means:",a:"Model explains 85% of variance in y",d:["85% accurate","85% within 1 std dev","Correlation is 0.85"],x:"$R^2 = 1 - SS_{\\text{res}}/SS_{\\text{tot}}$, comparing to a naive mean predictor.",s:"5-evaluating-regression-models"},
{m:"1B",c:"Complexity",q:"Time complexity of OLS (Ordinary Least Squares) closed-form?",a:"$O(p^3)$ due to matrix inversion",d:["$O(np)$","$O(n^2 p)$","$O(p^2)$"],x:"Inverting the $p \\times p$ matrix dominates. For large $p$, use gradient descent.",s:"2-ordinary-least-squares-ols"},
{m:"1B",c:"Concept",q:"Bias-variance decomposition of MSE (Mean Squared Error):",a:"$\\text{Bias}^2$ + Variance + irreducible noise",d:["Bias + Variance","Bias^2 + Variance^2","Bias * Variance + noise"],x:"MSE decomposes into: how far off the model is on average (bias$^2$), how much it fluctuates across training sets (variance), and noise inherent in the data ($\\sigma^2$). Increasing complexity reduces bias but increases variance. The noise term is a floor you can never beat.",w:{"Bias + Variance":"Close, but bias is squared in the decomposition — the derivation squares (f - E[f-hat]) when expanding the expectation.","Bias^2 + Variance^2":"Variance is already E[(f-hat - E[f-hat])^2], which is a squared quantity. Squaring it again would be wrong."},s:"8-bias-variance-tradeoff-in-action"},

// ---- 1C: Classification ----
{m:"1C",c:"Equation",q:"The sigmoid function is:",a:"$\\sigma(z) = \\frac{1}{1 + e^{-z}}$",d:["$\\sigma(z) = \\frac{e^z}{(1+e^z)^2}$","$\\sigma(z) = \\tanh(z)$","$\\sigma(z) = \\max(0,z)$"],x:"Squashes any real number into (0,1) for use as a probability. Large positive inputs map near 1, large negative near 0. This smooth, differentiable mapping enables gradient-based training for binary classification.",s:"2-logistic-regression"},
{m:"1C",c:"Loss",q:"Logistic regression minimizes:",a:"Binary cross-entropy (negative log-likelihood)",d:["MSE (Mean Squared Error)","Hinge loss","Huber loss"],x:"$\\text{NLL} = -\\sum[y \\log \\hat{y} + (1-y)\\log(1-\\hat{y})]$. From Bernoulli MLE.",s:"2-logistic-regression"},
{m:"1C",c:"Concept",q:"Why is squared error bad for logistic regression?",a:"Non-convex surface with local minima and gradient saturation",d:["Requires matrix inversion","Can't handle binary labels","Always underfits"],x:"Sigmoid output flattens near 0 and 1 (saturation). The squared error gradient includes sigmoid's derivative, which is near zero in saturated regions — weight updates become vanishingly small, stalling training. Cross-entropy avoids this because its gradient cancels the sigmoid derivative.",w:{"Can't handle binary labels":"Squared error can technically handle 0/1 labels — it just creates a non-convex loss surface with sigmoid, making optimization unreliable.","Always underfits":"The issue is the opposite direction — the loss landscape has bad local minima, making optimization unreliable, not that the model is too simple."},s:"2-logistic-regression"},
{m:"1C",c:"Algorithm",q:"Softmax generalizes sigmoid to:",a:"$K$ classes: $P(y\\!=\\!k|x) = \\frac{e^{\\mathbf{w}_k^\\top x}}{\\sum_j e^{\\mathbf{w}_j^\\top x}}$",d:["Tanh to multi-output","ReLU to probabilities","Step function to fuzzy logic"],x:"Softmax normalizes raw scores into probabilities summing to 1: each class gets $e^{z_k} / \\sum e^{z_j}$. For K=2, this simplifies algebraically to the sigmoid applied to the difference of the two scores.",s:"3-multiclass-classification"},
{m:"1C",c:"Concept",q:"Naive Bayes' key (usually wrong) assumption:",a:"Features are conditionally independent given the class",d:["Classes equally likely","Features normally distributed","Boundary is linear"],x:"Almost always wrong, yet works because only decision boundary needs to be correct.",s:"6-naive-bayes"},
{m:"1C",c:"Algorithm",q:"Soft-margin SVM (Support Vector Machine) minimizes:",a:"$\\frac{1}{2}\\|\\mathbf{w}\\|^2 + C \\sum \\xi_i$ with margin constraints",d:["Cross-entropy + L2","Sum of squared residuals","KL divergence"],x:"C controls tradeoff: large C = hard margin, small C = wider margin.",s:"7-support-vector-machines-svms"},
{m:"1C",c:"Concept",q:"The kernel trick avoids:",a:"Explicitly computing high-dimensional feature maps",d:["Matrix inversion","Gradient computation","Cross-validation"],x:"$K(x_i, x_j) = \\phi(x_i)^\\top \\phi(x_j)$ without forming $\\phi$.",s:"7-support-vector-machines-svms"},
{m:"1C",c:"Algorithm",q:"RBF (Radial Basis Function) kernel maps to what feature space?",a:"Infinite-dimensional",d:["2D","Same as input","p^2 dimensional"],x:"Taylor expansion of the Gaussian has infinite terms.",s:"7-support-vector-machines-svms"},
{m:"1C",c:"Metric",q:"When is precision more important than recall?",a:"When false positives are costly",d:["Balanced dataset","False negatives costly","Need high accuracy"],x:"$\\text{Precision} = \\frac{TP}{TP+FP}$. High precision = few false alarms.",s:"8-evaluating-classifiers"},
{m:"1C",c:"Metric",q:"F1 score uses what type of mean?",a:"Harmonic",d:["Arithmetic","Geometric","Weighted"],x:"$F_1 = \\frac{2PR}{P+R}$. Harmonic mean penalizes imbalance.",s:"8-evaluating-classifiers"},
{m:"1C",c:"Algorithm",q:"LDA (Linear Discriminant Analysis) assumes all classes share the same ___ but different ___.",a:"Covariance matrix; means",d:["Means; variances","Priors; likelihoods","Features; labels"],x:"$P(x|y\\!=\\!k) \\sim \\mathcal{N}(\\mu_k, \\Sigma)$ with shared $\\Sigma$.",s:"5-linear-discriminant-analysis-lda"},

// ---- 1D: Model Selection ----
{m:"1D",c:"Concept",q:"The 'cardinal sin' of evaluation:",a:"Using test set for model selection",d:["No regularization","Too many epochs","Too many features"],x:"The test set must be a surprise — data the model has never influenced and that has never influenced the model. If you use test performance to choose hyperparameters or features, your reported accuracy will be optimistically biased because you selected for it.",s:"1-train-validation-test-split"},
{m:"1D",c:"Algorithm",q:"In k-fold CV (Cross-Validation), each fold is validation how many times?",a:"Exactly once",d:["k times","k-1 times","Twice"],x:"Data splits into k equal parts. Each round, one part validates while k-1 parts train. After k rounds, every point has been validated exactly once. The average score estimates generalization with lower variance than a single train/test split.",s:"2-cross-validation"},
{m:"1D",c:"Concept",q:"Why does random search often beat grid search?",a:"Explores more unique values per dimension",d:["Always faster","Uses Bayesian optimization","Avoids local minima"],x:"Most hyperparameters have unequal importance. Grid search spaces evaluations evenly, so a 10x10 grid only tests 10 unique values per parameter. Random search tests a unique value in every trial for every parameter, exploring the important dimensions more efficiently.",s:"4-hyperparameter-tuning"},
{m:"1D",c:"Concept",q:"Average fraction of unique points in a bootstrap sample:",a:"~63.2%",d:["~50%","~75%","~90%"],x:"$P(\\text{included}) = 1 - (1-1/n)^n \\to 1 - 1/e \\approx 0.632$.",s:"3-the-bootstrap"},
{m:"1D",c:"Concept",q:"What is data leakage?",a:"Test/future information contaminates training",d:["Data lost in preprocessing","Features dropped accidentally","Model memorizes training"],x:"Any time information from the test set influences training — even indirectly. Common examples: computing mean/std on the full dataset before splitting, using future timestamps to predict past events, or including features derived from the target variable.",s:"8-common-pitfalls"},
{m:"1D",c:"Concept",q:"BIC (Bayesian Information Criterion) vs AIC (Akaike Information Criterion): BIC's penalty is:",a:"$k \\ln(n)$ vs AIC's $2k$ — heavier for large $n$",d:["Always lighter","Same penalty","2k^2"],x:"For large $n$, $\\ln(n) > 2$, so BIC selects simpler models.",s:"6-information-criteria"},

// ---- 1E: Trees & Ensembles ----
{m:"1E",c:"Equation",q:"Gini impurity formula:",a:"$G = 1 - \\sum p_k^2$",d:["$G = \\sum p_k^2$","$G = -\\sum p_k \\log p_k$","$G = \\sum p_k(1-p_k)^2$"],x:"Gini measures how often a randomly chosen element would be misclassified under the node's class distribution. Pure node (all one class): $G=0$, no error possible. Maximum when classes are equally split — random guessing is worst. Trees split to minimize child Gini.",s:"1-decision-trees"},
{m:"1E",c:"Concept",q:"Decision trees are greedy — what does this mean?",a:"Each split is locally optimal without considering future splits",d:["Use all features at once","Always find global optimum","Require sorted data"],x:"At each node, the tree picks the single best split by impurity reduction right now. It never reconsiders earlier splits even if a different choice would have led to a better overall tree. Fast to train, but rarely finds the globally optimal tree.",s:"1-decision-trees"},
{m:"1E",c:"Weakness",q:"Primary weakness of a single decision tree:",a:"High variance — small data changes produce different trees",d:["High bias","Slow training","Can't handle categoricals"],x:"A small change in training data can completely change the tree structure — different root split, different branches. This instability (high variance) means single trees overfit easily. Ensembles like Random Forests reduce this by averaging many trees trained on different bootstrap samples.",s:"2-why-single-trees-fail"},
{m:"1E",c:"Algorithm",q:"Random Forest's key innovation over bagging:",a:"Random subset of m features considered at each split",d:["Deeper trees","Gradient descent","Post-training pruning"],x:"Decorrelates trees. Default $m = \\sqrt{p}$ for classification.",s:"4-random-forests"},
{m:"1E",c:"Concept",q:"Bagging reduces ___, boosting reduces ___.",a:"Variance; bias",d:["Bias; variance","Both bias","Both variance"],x:"Bagging trains many independent high-variance models on bootstrap samples and averages them — averaging reduces variance without increasing bias. Boosting trains sequentially, each new model focusing on previous errors — this iterative correction reduces systematic bias.",w:{"Bias; variance":"Common mix-up. Bagging averages many high-variance models (like deep trees) to stabilize them. Boosting sequentially fixes errors, reducing systematic bias."},s:"3-bagging-bootstrap-aggregating"},
{m:"1E",c:"Algorithm",q:"In gradient boosting, each new tree fits:",a:"Negative gradient (pseudo-residuals) of the loss",d:["Original labels","Previous predictions","Random feature subsets"],x:"Each step computes the negative gradient of the loss w.r.t. current predictions. For MSE this is simply residuals (target minus prediction). For other losses (logistic, Huber), the negative gradient differs, but the principle is the same: each tree corrects what the ensemble currently gets most wrong.",s:"5-boosting-learning-from-mistakes"},
{m:"1E",c:"Concept",q:"Why use a small learning rate in gradient boosting?",a:"Shrinkage prevents overfitting each correction",d:["Speeds training","Fewer trees needed","Deeper trees"],x:"Smaller $\\eta$ = more trees but better generalization. Typical: 0.01-0.1.",s:"5-boosting-learning-from-mistakes"},
{m:"1E",c:"Concept",q:"Can adding more trees to a Random Forest overfit?",a:"No — more trees just reduce variance with diminishing returns",d:["Yes always","Only if shallow","Only with boosting"],x:"Each RF tree is trained independently on a bootstrap sample. Adding more trees just improves the average — variance decreases monotonically (law of large numbers). In boosting, each tree depends on all previous ones, so adding too many can overfit by chasing noise in the residuals.",s:"4-random-forests"},
{m:"1E",c:"Algorithm",q:"XGBoost's regularization includes:",a:"Penalty on leaf count ($\\gamma|T|$) and L2 on leaf weights",d:["Only L1 on features","Dropout on trees","Batch normalization"],x:"XGBoost adds a penalty per leaf ($\\gamma|T|$) and L2 on leaf weights ($\\lambda \\sum w_j^2$) directly to the loss. The optimization itself considers tree complexity — not just post-hoc pruning — giving built-in regularization.",s:"6-xgboost-lightgbm-catboost-modern-gradient-boosting"},
{m:"1E",c:"Algorithm",q:"LightGBM's key speed innovation:",a:"Histogram-based splitting — bin features into ~256 buckets",d:["Uses image histograms","Plots feature distributions","Only works with discrete data"],x:"Reduces split search from $O(n)$ to $O(\\text{bins})$.",s:"6-xgboost-lightgbm-catboost-modern-gradient-boosting"},

// ---- 1F: Unsupervised ----
{m:"1F",c:"Equation",q:"PCA (Principal Component Analysis) finds eigenvectors of:",a:"Covariance matrix $\\mathbf{S} = \\frac{1}{N-1} \\mathbf{X}^\\top \\mathbf{X}$",d:["Data matrix X","Identity matrix","Gram matrix XX^T"],x:"Eigenvectors = principal components. Eigenvalues = variance captured.",s:"1-principal-component-analysis-pca"},
{m:"1F",c:"Algorithm",q:"K-Means++ chooses new centroids with probability proportional to:",a:"$D(x)^2$ — squared distance to nearest centroid",d:["1/K uniformly","Point's L1 norm","Point's density"],x:"Spreads initial centroids out for better convergence.",s:"2-k-means-clustering"},
{m:"1F",c:"Concept",q:"K-Means is EM (Expectation-Maximization) on a GMM (Gaussian Mixture Model) with what constraint?",a:"Isotropic covariance $\\sigma^2 I$ with $\\sigma \\to 0$ (hard assignments)",d:["Equal means","Zero mixing weights","Full-rank covariances"],x:"K-Means is the hard-assignment limit of GMM.",s:"4-gaussian-mixture-models-gmms-and-the-em-algorithm"},
{m:"1F",c:"Weakness",q:"Critical limitation of t-SNE (t-Distributed Stochastic Neighbor Embedding) often overlooked:",a:"Between-cluster distances and cluster sizes are meaningless",d:["Only handles 2 features","Requires labels","Always same output"],x:"Preserves local structure only. Far-apart clusters might be close in original space.",s:"5-dimensionality-reduction-beyond-pca"},
{m:"1F",c:"Algorithm",q:"EM (Expectation-Maximization) algorithm's E-step computes:",a:"Responsibilities — posterior probability of each cluster per point",d:["New cluster means","Log-likelihood","Feature importances"],x:"Bayes' theorem applied to each point: soft cluster assignments.",s:"4-gaussian-mixture-models-gmms-and-the-em-algorithm"},
{m:"1F",c:"Algorithm",q:"Isolation Forest detects anomalies by:",a:"Shorter path length to isolate (fewer random splits)",d:["Low density","Far from centers","High variance"],x:"Random splits isolate outliers quickly because they're few and different.",s:"6-anomaly-outlier-detection"},
{m:"1F",c:"Concept",q:"UMAP (Uniform Manifold Approximation and Projection) main advantage over t-SNE:",a:"Faster, preserves more global structure, arbitrary output dims",d:["Always better clusters","No hyperparameters","Only works with labels"],x:"t-SNE limited to 2-3D visualization; UMAP does general DR.",s:"5-dimensionality-reduction-beyond-pca"},
{m:"1F",c:"Metric",q:"Silhouette score near 0 means:",a:"Point is on the boundary between two clusters",d:["Perfect cluster member","Outlier","Clustering failed"],x:"$s(i) = (b-a)/\\max(a,b)$. Near 0 means equally close to own and neighboring cluster.",s:"2-k-means-clustering"},
{m:"1F",c:"Algorithm",q:"Ward's linkage minimizes:",a:"Increase in total within-cluster variance",d:["Max pairwise distance","Number of clusters","Dendrogram entropy"],x:"Produces compact, balanced clusters similar to K-Means.",s:"3-hierarchical-clustering"},

// ---- 2A: Neural Networks ----
{m:"2A",c:"Concept",q:"Why can't a single-layer perceptron solve XOR?",a:"XOR is not linearly separable",d:["Too many parameters","Gradient vanishes","Requires convolution"],x:"Adding a hidden layer creates a nonlinear decision boundary that solves XOR.",w:{"Too many parameters":"A single perceptron has very few parameters (just weights + bias). The issue isn't parameter count — it's that no single line can separate the XOR outputs.","Requires convolution":"Convolution is for spatial patterns in images. XOR is a simple logic problem solvable with a 2-layer fully connected network."},s:"1-from-linear-models-to-neural-networks"},
{m:"2A",c:"Concept",q:"The Universal Approximation Theorem states:",a:"A single hidden layer with enough neurons can approximate any continuous function",d:["Deep nets are always better","Neural nets find global optima","ReLU is the best activation"],x:"Guarantees existence but not learnability — doesn't say how many neurons or how to train.",s:"4-feedforward-networks-mlps"},
{m:"2A",c:"Algorithm",q:"Backpropagation computes gradients using:",a:"The chain rule applied through the computational graph",d:["Finite differences","Random perturbations","Matrix inversion"],x:"Reverse-mode autodiff: compute loss, then propagate gradients backward layer by layer.",s:"7-backpropagation"},
{m:"2A",c:"Concept",q:"ReLU's main advantage over sigmoid/tanh:",a:"No gradient saturation for positive inputs — faster training",d:["Always differentiable","Bounded output","Symmetric around zero"],x:"$\\text{ReLU}(x) = \\max(0,x)$. Gradient is 1 for $x>0$, avoiding the vanishing gradient problem.",w:{"Always differentiable":"ReLU is NOT differentiable at x=0. Sigmoid and tanh are actually smoother. ReLU wins despite this because its gradient doesn't vanish for positive inputs.","Bounded output":"ReLU is unbounded (outputs can grow to infinity). Sigmoid [0,1] and tanh [-1,1] are bounded. That's actually their weakness — saturation kills gradients.","Symmetric around zero":"Tanh is symmetric around zero, not ReLU. ReLU outputs 0 for all negative inputs."},s:"3-activation-functions"},
{m:"2A",c:"Concept",q:"Forward mode vs reverse mode autodiff — when is reverse preferred?",a:"When outputs << inputs (most neural nets: scalar loss, many parameters)",d:["When inputs << outputs","Always","Never"],x:"Reverse mode computes all parameter gradients in one backward pass. Forward mode needs one pass per parameter.",s:"8-automatic-differentiation"},

// ---- 2B: Optimization ----
{m:"2B",c:"Concept",q:"Why are saddle points more problematic than local minima in high dimensions?",a:"Saddle points are exponentially more common than local minima in high-D",d:["Saddle points have zero gradient","Local minima are rare","Saddle points are global optima"],x:"In high-D, a critical point is a local min only if ALL eigenvalues of the Hessian are positive — extremely unlikely.",w:{"Saddle points have zero gradient":"Both saddle points AND local minima have zero gradient — that's what makes them critical points. The difference is frequency: saddle points vastly outnumber local minima in high dimensions.","Local minima are rare":"This is actually true! But the question asks why saddle points are MORE problematic — it's because they're exponentially more common, so gradient descent gets stuck at them more often."},s:"2-the-loss-landscape-of-neural-networks"},
{m:"2B",c:"Algorithm",q:"Adam optimizer combines:",a:"Momentum (1st moment) + RMSProp (2nd moment) with bias correction",d:["SGD (Stochastic Gradient Descent) + dropout","L1 + L2 penalties","Learning rate + batch size"],x:"Adaptive per-parameter learning rates using running averages of gradient and squared gradient.",s:"5-optimizers-in-depth"},
{m:"2B",c:"Concept",q:"Batch Normalization normalizes across which dimension?",a:"The batch dimension — each feature normalized over the mini-batch",d:["Feature dimension","Time dimension","Layer dimension"],x:"For each feature: subtract batch mean, divide by batch std, then scale and shift with learned params.",s:"6-batch-normalization"},
{m:"2B",c:"Concept",q:"What is the linear scaling rule for learning rate?",a:"When multiplying batch size by k, multiply learning rate by k",d:["Keep LR constant","Divide LR by k","Square the LR"],x:"Larger batches have lower gradient noise, so you can take larger steps.",s:"4-learning-rate-the-most-important-hyperparameter"},
{m:"2B",c:"Algorithm",q:"Cosine annealing schedules the learning rate as:",a:"LR decreases following a cosine curve from max to min",d:["LR increases linearly","LR stays constant then drops","LR oscillates randomly"],x:"Smooth decay that spends more time at low LR. Often combined with warm restarts.",s:"4-learning-rate-the-most-important-hyperparameter"},
{m:"2B",c:"Concept",q:"Residual/skip connections solve:",a:"Vanishing gradients — gradient flows directly through the skip path",d:["Overfitting","Slow data loading","Memory overflow"],x:"$h(x) = f(x) + x$. The identity shortcut ensures gradient >= 1 along the skip path.",s:"7-gradient-flow-problems"},

// ---- 2C: Regularization ----
{m:"2C",c:"Algorithm",q:"Dropout during training does what?",a:"Randomly zeroes out neurons with probability p at each forward pass",d:["Removes layers","Reduces learning rate","Clips gradients"],x:"Forces redundant representations. At test time, scale weights by (1-p) or use inverted dropout.",s:"3-dropout"},
{m:"2C",c:"Concept",q:"Early stopping is equivalent to what form of regularization?",a:"L2 regularization (approximately)",d:["L1","Dropout","Data augmentation"],x:"Stopping before convergence constrains the effective norm of the weights, similar to an L2 penalty.",s:"4-early-stopping"},
{m:"2C",c:"Concept",q:"The double descent phenomenon shows:",a:"Test error can decrease again after the interpolation threshold as model grows larger",d:["Error always increases with complexity","Error plateaus after overfitting","Training error goes to zero then increases"],x:"Classical U-shaped curve is incomplete — very large models generalize well again. Challenges traditional bias-variance.",s:"8-the-double-descent-phenomenon"},
{m:"2C",c:"Concept",q:"Label smoothing replaces hard labels [0,1] with:",a:"Soft targets like [0.05, 0.95] to prevent overconfident predictions",d:["Random labels","Averaged labels","Reversed labels"],x:"Prevents the model from becoming too confident, improving calibration and generalization.",s:"7-label-smoothing"},
{m:"2C",c:"Concept",q:"The Lottery Ticket Hypothesis states:",a:"Dense networks contain sparse subnetworks that can train to full accuracy alone",d:["All weights are equally important","Pruning always hurts","Random initialization doesn't matter"],x:"'Winning tickets' are subnetworks whose initialization enables successful training.",s:"9-implicit-regularization"},

// ---- 2D: CNNs ----
{m:"2D",c:"Concept",q:"CNNs (Convolutional Neural Networks) exploit what two properties of images?",a:"Translation invariance (shared weights) and locality (small receptive fields)",d:["Color and brightness","Resolution and aspect ratio","Compression and encoding"],x:"Convolution with shared filters detects the same pattern anywhere. Small kernels capture local structure.",s:"2-the-convolution-operation"},
{m:"2D",c:"Algorithm",q:"What does a convolutional filter detect?",a:"A local spatial pattern (edge, texture, etc.) via learned weights",d:["Global image statistics","Color histograms","Pixel coordinates"],x:"Early layers detect edges, middle layers textures/parts, deep layers objects.",s:"2-the-convolution-operation"},
{m:"2D",c:"Concept",q:"ResNet's key insight was:",a:"Skip connections enable training very deep networks (100+ layers)",d:["Wider layers are better","Pooling is unnecessary","Smaller kernels are always better"],x:"Without skip connections, gradients vanish in deep nets. Residual learning: learn $f(x) = h(x) - x$ instead.",s:"6-landmark-architectures"},
{m:"2D",c:"Algorithm",q:"Transfer learning's two main strategies:",a:"Feature extraction (freeze base) and fine-tuning (unfreeze and train)",d:["Train from scratch both times","Only use pretrained weights","Only train the first layer"],x:"Feature extraction: new head on frozen backbone. Fine-tuning: unfreeze some layers, low LR.",s:"7-transfer-learning"},
{m:"2D",c:"Concept",q:"The receptive field of a neuron in a CNN (Convolutional Neural Network) is:",a:"The region of the input image that influences that neuron's output",d:["The size of the filter","The number of channels","The activation function"],x:"Deeper layers have larger receptive fields. Stacked 3x3 convolutions build up a large receptive field efficiently.",s:"3-cnn-building-blocks"},

// ---- 2E: Sequence Models ----
{m:"2E",c:"Concept",q:"The fundamental problem of vanilla RNNs (Recurrent Neural Networks):",a:"Vanishing/exploding gradients over long sequences",d:["Too many parameters","Can't handle variable length","Slow inference"],x:"Gradients multiply through many time steps — exponential decay or growth. LSTMs solve this.",s:"3-the-vanishing-and-exploding-gradient-problem"},
{m:"2E",c:"Algorithm",q:"LSTM (Long Short-Term Memory) cell state acts as:",a:"A highway for gradient flow — information persists with minimal transformation",d:["An activation function","A loss accumulator","A learning rate scheduler"],x:"The cell state runs through with only addition and element-wise gating, preserving long-range gradients.",s:"4-long-short-term-memory-lstm"},
{m:"2E",c:"Algorithm",q:"LSTM (Long Short-Term Memory) has three gates:",a:"Forget gate, input gate, output gate",d:["Read, write, execute","Encode, decode, attend","Add, multiply, normalize"],x:"Forget: what to discard. Input: what new info to store. Output: what to expose as hidden state.",s:"4-long-short-term-memory-lstm"},
{m:"2E",c:"Algorithm",q:"GRU (Gated Recurrent Unit) simplifies LSTM by:",a:"Combining forget and input gates into one update gate (2 gates total)",d:["Removing all gates","Adding a fourth gate","Using convolution"],x:"GRU has reset and update gates. Similar performance to LSTM with fewer parameters.",s:"5-gated-recurrent-unit-gru"},
{m:"2E",c:"Concept",q:"Seq2seq models suffer from what bottleneck?",a:"The entire input is compressed into a single fixed-length vector",d:["Too many decoder layers","Vocabulary size","Training data size"],x:"Motivates attention: let the decoder look at all encoder states, not just the final one.",s:"7-sequence-to-sequence-models"},

// ---- 3A: Transformers ----
{m:"3A",c:"Equation",q:"Scaled dot-product attention formula:",a:"$\\text{Attention}(Q,K,V) = \\text{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right) V$",d:["$\\text{softmax}(QV^\\top / d_k) K$","$\\sigma(QK^\\top) V$","$Q^\\top K V / n$"],x:"Division by $\\sqrt{d_k}$ prevents softmax saturation for large $d_k$.",s:"2-self-attention-attention-without-encoder-decoder"},
{m:"3A",c:"Concept",q:"Why use multi-head attention instead of single-head?",a:"Different heads attend to different relationship types in parallel",d:["Reduces parameters","Eliminates positional encoding","Faster than single head"],x:"Head 1 might capture syntax, head 2 semantics, etc. Concat and project.",s:"3-multi-head-attention"},
{m:"3A",c:"Concept",q:"Why do Transformers need positional encoding?",a:"Self-attention is permutation-invariant — no inherent notion of order",d:["To reduce parameters","To handle variable-length input","To normalize activations"],x:"Without position info, 'dog bites man' = 'man bites dog' to the model.",w:{"To handle variable-length input":"Transformers already handle variable length via padding/masking. Positional encoding adds ORDER information, not length handling.","To normalize activations":"Layer norm handles activation normalization. Positional encoding injects sequence position so the model knows which token comes first, second, etc."},s:"5-positional-encoding-giving-transformers-a-sense-of-order"},
{m:"3A",c:"Algorithm",q:"Transformer decoder uses masked self-attention to:",a:"Prevent attending to future tokens during generation",d:["Speed up training","Reduce memory","Handle missing data"],x:"Causal mask: position i can only attend to positions <= i. Ensures autoregressive generation.",s:"6-masked-self-attention-preventing-the-future-from-leaking"},
{m:"3A",c:"Concept",q:"The position-wise FFN (Feed-Forward Network) in each Transformer block does:",a:"Applies the same 2-layer MLP (Multi-Layer Perceptron) independently to each position",d:["Convolves across positions","Attends to neighboring tokens","Pools over the sequence"],x:"expand -> ReLU/GELU -> project back. Same weights at every position; no cross-position interaction.",s:"4-the-transformer-architecture"},

// ---- 3B: Generative Models ----
{m:"3B",c:"Concept",q:"VAE (Variational Autoencoder) loss function (ELBO) has two terms:",a:"Reconstruction loss + KL (Kullback-Leibler) divergence from prior",d:["MSE + accuracy","Hinge loss + entropy","Cross-entropy + L2"],x:"Reconstruction = faithful output. KL = keep latent distribution close to $\\mathcal{N}(0, I)$.",s:"3-variational-autoencoders-vaes"},
{m:"3B",c:"Concept",q:"Why do VAEs (Variational Autoencoders) produce blurry images?",a:"Reconstruction loss (MSE) averages over plausible outputs",d:["Too few latent dimensions","Wrong activation function","Not enough training data"],x:"When multiple sharp images are plausible, minimizing MSE produces their blurry average.",s:"3-variational-autoencoders-vaes"},
{m:"3B",c:"Algorithm",q:"The reparameterization trick enables:",a:"Backpropagation through stochastic sampling: $z = \\mu + \\sigma \\cdot \\epsilon$",d:["Faster training","Larger batch sizes","Better initialization"],x:"Can't backprop through random sampling. Rewrite $z$ so randomness ($\\epsilon \\sim \\mathcal{N}(0,1)$) is external.",s:"3-variational-autoencoders-vaes"},
{m:"3B",c:"Concept",q:"GANs (Generative Adversarial Networks) suffer from mode collapse — what is it?",a:"Generator produces only a few modes of the data, ignoring diversity",d:["Discriminator always wins","Training is too slow","Loss goes to infinity"],x:"Generator finds a few outputs that fool the discriminator and stops exploring.",s:"4-generative-adversarial-networks-gans"},
{m:"3B",c:"Algorithm",q:"Diffusion models learn to:",a:"Reverse a gradual noise-corruption process (denoise step by step)",d:["Encode images to latent space","Adversarially fool a critic","Maximize likelihood directly"],x:"Forward: add noise over T steps. Reverse: neural net predicts and removes noise at each step.",s:"5-diffusion-models-the-current-frontier"},

// ---- 3C: Self-Supervised Learning ----
{m:"3C",c:"Algorithm",q:"GPT (Generative Pre-trained Transformer) pretraining objective:",a:"Autoregressive next-token prediction (causal language modeling)",d:["Masked language modeling","Image classification","Contrastive learning"],x:"Predict the next token given all previous tokens. Causal mask prevents looking ahead.",s:"3-language-self-supervision"},
{m:"3C",c:"Algorithm",q:"BERT (Bidirectional Encoder Representations from Transformers) pretraining objective:",a:"Masked language modeling — predict randomly masked tokens bidirectionally",d:["Next-token prediction","Image-text matching","Reinforcement learning"],x:"Mask 15% of tokens (80% [MASK], 10% random, 10% unchanged). Bidirectional context.",s:"3-language-self-supervision"},
{m:"3C",c:"Algorithm",q:"SimCLR contrastive learning works by:",a:"Pulling augmented views of same image together, pushing different images apart",d:["Predicting rotation angle","Colorizing grayscale images","Generating image captions"],x:"Two augmentations of same image = positive pair. All other images in batch = negatives. NT-Xent loss.",s:"4-vision-self-supervision"},
{m:"3C",c:"Concept",q:"Why does scale matter so much for GPT (Generative Pre-trained Transformer) models?",a:"Emergent capabilities appear at sufficient scale (in-context learning, reasoning)",d:["Smaller models can't converge","Architecture doesn't matter","Only data quality matters"],x:"Scaling laws show predictable improvement with more compute, data, and parameters.",s:"8-scaling-laws-and-emergent-abilities"},

// ---- 3D: Reinforcement Learning ----
{m:"3D",c:"Equation",q:"Bellman equation for state-value $V^\\pi(s)$:",a:"$V(s) = \\mathbb{E}[R + \\gamma V(s') \\mid s, \\pi]$",d:["$V(s) = \\max R$","$V(s) = \\sum P(s'|s)$","$V(s) = R / \\gamma$"],x:"Value = immediate reward + discounted future value. Foundation of all RL (Reinforcement Learning) algorithms.",s:"3-value-functions-and-the-bellman-equations"},
{m:"3D",c:"Concept",q:"Exploration vs exploitation tradeoff:",a:"Try new actions (explore) vs use best known action (exploit)",d:["Training vs testing","Online vs offline","Model vs data"],x:"Too much exploitation = miss better options. Too much exploration = waste time.",s:"1-a-different-paradigm"},
{m:"3D",c:"Algorithm",q:"Q-Learning is off-policy because:",a:"It updates using the max Q over next actions, regardless of the policy actually followed",d:["It uses a replay buffer","It trains offline","It has no policy"],x:"Target: $R + \\gamma \\max_{a'} Q(s',a')$. The max makes it learn the optimal policy regardless of behavior.",s:"6-temporal-difference-learning-the-key-innovation"},
{m:"3D",c:"Algorithm",q:"REINFORCE algorithm estimates policy gradient using:",a:"Monte Carlo returns as the reward signal (complete episode rollouts)",d:["Temporal difference errors","Dynamic programming","Supervised labels"],x:"Gradient: $\\mathbb{E}[\\sum \\nabla \\log \\pi(a|s) \\cdot G_t]$. High variance — that's why baselines help.",s:"8-policy-gradient-methods"},
{m:"3D",c:"Concept",q:"Discount factor gamma's role:",a:"Controls how much the agent values future vs immediate rewards",d:["Sets the learning rate","Determines episode length","Controls exploration"],x:"$\\gamma=0$: greedy (only immediate). $\\gamma=1$: far-sighted (all future rewards equal).",s:"2-markov-decision-processes-mdps"},

// ---- 4A: NLP ----
{m:"4A",c:"Algorithm",q:"BPE (Byte Pair Encoding) tokenization works by:",a:"Iteratively merging the most frequent adjacent character pairs",d:["Splitting on whitespace","Using a dictionary lookup","Character-level encoding only"],x:"Start with characters, greedily merge frequent pairs. Handles rare/unseen words via subwords.",s:"2-tokenization-turning-text-into-numbers"},
{m:"4A",c:"Concept",q:"Word2Vec's skip-gram objective:",a:"Predict context words given the center word",d:["Predict center word from context","Classify word sentiment","Translate between languages"],x:"Learns embeddings where similar words have similar vectors. 'king - man + woman ~ queen'.",s:"3-word-embeddings-the-ideas-that-still-matter"},
{m:"4A",c:"Metric",q:"Perplexity measures:",a:"How surprised the model is by the test data (lower = better)",d:["Model size","Training speed","Vocabulary coverage"],x:"$\\text{PPL} = 2^{H}$ where $H$ is cross-entropy. A model with PPL=50 is as uncertain as choosing uniformly from 50 words.",s:"10-evaluation"},
{m:"4A",c:"Algorithm",q:"RLHF (Reinforcement Learning from Human Feedback) does:",a:"Fine-tunes LLM using a reward model trained on human preference rankings",d:["Trains from scratch with RL","Replaces all supervised training","Only works for games"],x:"SFT (Supervised Fine-Tuning) -> train reward model on preferences -> optimize policy with PPO against reward model.",s:"7-instruction-tuning-and-alignment"},
{m:"4A",c:"Algorithm",q:"Top-p (nucleus) sampling selects tokens from:",a:"The smallest set of tokens whose cumulative probability exceeds p",d:["The top p tokens by count","Random tokens with probability p","All tokens equally"],x:"Adapts vocabulary size dynamically. High probability = few tokens. Flat distribution = many tokens.",s:"6-the-gpt-lineage-autoregressive-decoders"},

// ---- 4B: Computer Vision ----
{m:"4B",c:"Algorithm",q:"YOLO (You Only Look Once) key innovation for object detection:",a:"Single-pass detection — predicts boxes and classes in one forward pass",d:["Uses multiple region proposals","Processes each pixel separately","Requires depth maps"],x:"Divide image into grid. Each cell predicts bounding boxes and class probabilities simultaneously.",s:"2-object-detection"},
{m:"4B",c:"Algorithm",q:"U-Net's skip connections in segmentation:",a:"Concatenate encoder features with decoder at each level for fine detail",d:["Add residuals like ResNet","Pool features globally","Skip the decoder entirely"],x:"Encoder captures context, decoder needs fine spatial detail from encoder via skip connections.",s:"3-semantic-segmentation"},
{m:"4B",c:"Metric",q:"IoU (Intersection over Union) measures:",a:"Overlap between predicted and ground-truth bounding boxes",d:["Classification accuracy","Pixel brightness","Feature similarity"],x:"$\\text{IoU} = \\frac{\\text{Area}(\\cap)}{\\text{Area}(\\cup)}$. IoU $> 0.5$ typically counts as a correct detection.",s:"9-evaluation-metrics"},
{m:"4B",c:"Algorithm",q:"Vision Transformer (ViT) processes images by:",a:"Splitting into patches, embedding them, then applying standard Transformer",d:["Using convolutional layers only","Processing pixel by pixel","Generating image captions"],x:"16x16 patches become tokens. Position embeddings added. Self-attention over patches.",s:"5-vision-transformers-vit"},
{m:"4B",c:"Concept",q:"Dilated (atrous) convolutions in DeepLab enable:",a:"Larger receptive fields without reducing resolution or adding parameters",d:["Faster training","Better color detection","Smaller model size"],x:"Insert gaps between kernel elements. Dilation rate 2 on a 3x3 kernel covers a 5x5 area.",s:"3-semantic-segmentation"},

// ---- 4C: Advanced RL ----
{m:"4C",c:"Algorithm",q:"PPO (Proximal Policy Optimization) clipped objective prevents:",a:"Destructively large policy updates",d:["Vanishing gradients","Overfitting to reward","Memory overflow"],x:"Clips the probability ratio to $[1-\\epsilon,\\; 1+\\epsilon]$, keeping updates conservative.",s:"2-advanced-policy-gradient-methods"},
{m:"4C",c:"Algorithm",q:"AlphaZero learns to play games by:",a:"Self-play from scratch + MCTS (Monte Carlo Tree Search) guided by a neural network",d:["Imitating human games only","Brute-force search","Random play"],x:"Neural net evaluates positions and guides search. Self-play generates training data. No human games needed.",s:"3-multi-agent-rl-and-self-play"},
{m:"4C",c:"Concept",q:"Offline RL (Reinforcement Learning) main challenge:",a:"Distribution shift — policy visits states not in the static dataset",d:["Too much exploration","Slow training","No reward signal"],x:"The learned policy may try actions never seen in data, where Q-estimates are unreliable.",s:"4-offline-rl-learning-from-fixed-datasets"},
{m:"4C",c:"Algorithm",q:"Decision Transformers reframe RL (Reinforcement Learning) as:",a:"Sequence modeling — predict actions conditioned on desired return",d:["Classification","Density estimation","Graph search"],x:"Input: (return-to-go, state, action) sequences. Transformer predicts next action given desired future return.",s:"4-offline-rl-learning-from-fixed-datasets"},
{m:"4C",c:"Concept",q:"Model-based RL (Reinforcement Learning) advantage and risk:",a:"More sample-efficient, but compounding model errors can diverge",d:["Always better than model-free","No hyperparameters","Guaranteed convergence"],x:"Learning a world model means fewer real interactions, but errors in the model accumulate over long rollouts.",s:"1-model-based-rl-learning-a-world-model"},

// ---- 4D: Bayesian ML ----
{m:"4D",c:"Equation",q:"Bayes' theorem in ML: posterior =",a:"likelihood * prior / marginal likelihood",d:["prior / likelihood","likelihood - prior","prior + evidence"],x:"$P(\\mathbf{w}|D) = \\frac{P(D|\\mathbf{w})P(\\mathbf{w})}{P(D)}$. The foundation of all Bayesian inference.",s:"1-the-bayesian-philosophy"},
{m:"4D",c:"Concept",q:"MAP (Maximum A Posteriori) estimation is Bayesian with what simplification?",a:"Point estimate at the posterior mode instead of the full posterior",d:["Uniform prior","No likelihood","Infinite data"],x:"$\\text{MAP} = \\arg\\max P(\\mathbf{w}|D)$. With Gaussian prior, MAP = Ridge regression. Loses uncertainty quantification.",s:"1-the-bayesian-philosophy"},
{m:"4D",c:"Algorithm",q:"Gaussian Processes define a distribution over:",a:"Functions — any finite set of points is jointly Gaussian",d:["Parameters","Data points","Loss surfaces"],x:"Specified by mean function and kernel. Prior over functions -> posterior after seeing data.",s:"2-gaussian-processes"},
{m:"4D",c:"Concept",q:"MC (Monte Carlo) Dropout approximates:",a:"Bayesian inference — dropout at test time gives uncertainty estimates",d:["Data augmentation","Feature selection","Model pruning"],x:"Run multiple forward passes with dropout on. Variance of predictions ~ epistemic uncertainty.",s:"3-bayesian-neural-networks"},
{m:"4D",c:"Algorithm",q:"HMC (Hamiltonian Monte Carlo) improves on Metropolis-Hastings by:",a:"Using gradient information to propose distant, high-probability samples",d:["Not requiring a proposal distribution","Running faster on GPUs","Using fewer samples"],x:"Simulates Hamiltonian dynamics on the posterior surface. Much more efficient in high dimensions.",s:"4-markov-chain-monte-carlo-mcmc"},

// ---- 5B: Practical ML Lab ----
{m:"5B",c:"API",q:"What are the three core verbs of the scikit-learn API?",a:"fit, transform, predict",d:["train, validate, test","load, process, output","compile, fit, evaluate"],x:"Every sklearn estimator uses .fit() to learn from data. Transformers add .transform() (and .fit_transform()). Predictors add .predict(). Pipelines chain these calls.",s:"section-1-scikit-learn--supervised-pipelines"},
{m:"5B",c:"Concept",q:"Why must StandardScaler be inside a Pipeline when using cross-validation?",a:"To prevent data leakage — scaler must fit only on each training fold",d:["It runs faster inside a Pipeline","Sklearn requires it","To avoid import errors"],x:"If you scale the full dataset before CV, test fold statistics leak into training. Inside a Pipeline, the scaler is refit on each training fold independently.",w:{"It runs faster inside a Pipeline":"Speed is not the reason — the issue is statistical: fitting on the full dataset leaks test information."},s:"exercise-1-end-to-end-regression-pipeline"},
{m:"5B",c:"API",q:"In a sklearn Pipeline, how do you reference a hyperparameter of a named step (e.g., 'clf') for GridSearchCV?",a:"Double underscore notation: clf__max_depth",d:["Dot notation: clf.max_depth","Dictionary: {'clf': {'max_depth': 5}}","Tuple: ('clf', 'max_depth')"],x:"The double underscore __ separates the step name from the parameter name. This is how GridSearchCV and set_params() address nested parameters in pipelines.",s:"exercise-3-hyperparameter-tuning"},
{m:"5B",c:"Concept",q:"What is the advantage of RandomizedSearchCV over GridSearchCV?",a:"Explores more of the hyperparameter space for the same compute budget",d:["Always finds the global optimum","Uses fewer CV folds","Requires no parameter ranges"],x:"Grid search evaluates every combination — combinatorial explosion with many params. Randomized search samples from distributions, covering more of the space with fewer evaluations. Bergstra & Bengio (2012) showed this is empirically better.",s:"exercise-3-hyperparameter-tuning"},
{m:"5B",c:"API",q:"What does ColumnTransformer do in sklearn?",a:"Applies different transformers to different column subsets and concatenates results",d:["Renames columns","Transposes the feature matrix","Selects the best features"],x:"Essential for real-world data: numerical columns get scaled, categorical columns get one-hot encoded, and the outputs are concatenated into a single feature matrix.",s:"exercise-4-feature-engineering-pipeline"},
{m:"5B",c:"Concept",q:"Why use OneHotEncoder(drop='first') instead of encoding all categories?",a:"Avoids the dummy variable trap (multicollinearity from redundant columns)",d:["Saves exactly one byte of memory","Required by all sklearn models","Prevents overfitting"],x:"With K categories, K binary columns are linearly dependent (they sum to 1). Dropping one removes the redundancy. Tree models don't care, but linear models can have issues.",s:"exercise-4-feature-engineering-pipeline"},
{m:"5B",c:"API",q:"In PyTorch, what does requires_grad=True do to a tensor?",a:"Tells PyTorch to track all operations for automatic gradient computation",d:["Makes the tensor immutable","Moves the tensor to GPU","Enables parallel computation"],x:"When you call .backward() on a loss computed from this tensor, PyTorch walks the computation graph in reverse and fills in .grad for every leaf tensor with requires_grad=True.",s:"exercise-7-tensors-autograd-and-linear-regression-in-pytorch"},
{m:"5B",c:"Concept",q:"Why is optimizer.zero_grad() required in the PyTorch training loop?",a:"PyTorch accumulates gradients by default — without zeroing, they grow each iteration",d:["It frees GPU memory","It resets the learning rate","It re-initializes weights"],x:"Gradient accumulation is useful when simulating larger batch sizes, but during standard training, you must zero gradients before each backward pass. Forgetting this is a common bug that causes training to diverge.",w:{"It frees GPU memory":"zero_grad() only resets .grad tensors to zero, it doesn't free any memory."},s:"exercise-7-tensors-autograd-and-linear-regression-in-pytorch"},
{m:"5B",c:"Concept",q:"What is the difference between model.train() and model.eval() in PyTorch?",a:"train() enables dropout and batch norm training behavior; eval() disables them",d:["train() compiles the model; eval() runs inference","train() uses GPU; eval() uses CPU","train() enables gradients; eval() disables them"],x:"Dropout randomly zeroes activations during training but must be off during evaluation. BatchNorm uses batch statistics during training but running averages during eval. Forgetting model.eval() at test time is a common bug.",w:{"train() enables gradients; eval() disables them":"Gradients are controlled by torch.no_grad(), not model.train()/eval(). You can compute gradients in eval mode and skip them in train mode."},s:"exercise-8-mnist-feedforward-classifier"},
{m:"5B",c:"API",q:"PyTorch's CrossEntropyLoss expects what kind of input?",a:"Raw logits (not softmax probabilities)",d:["Softmax probabilities","One-hot encoded labels","Normalized features"],x:"CrossEntropyLoss applies log_softmax + NLLLoss internally. Passing softmax outputs double-applies the softmax, making training unstable with very small gradients.",s:"exercise-8-mnist-feedforward-classifier"},
{m:"5B",c:"Concept",q:"Why does a CNN outperform a feedforward network on image data with fewer parameters?",a:"Parameter sharing and translation invariance exploit spatial structure",d:["CNNs always use GPU acceleration","Feedforward networks can't use ReLU","CNNs have more layers"],x:"A convolutional filter is applied across all spatial positions (parameter sharing), so the same edge detector works everywhere. Fully connected layers have unique weights for every pixel-to-neuron connection — wasteful for spatially structured data.",s:"exercise-9-cnn-for-fashion-mnist"},
{m:"5B",c:"Concept",q:"In transfer learning, why use a lower learning rate for fine-tuning than for training the new head?",a:"To avoid destroying the useful pretrained features with large weight updates",d:["Lower LR is always better","The pretrained weights are on GPU","The head has fewer parameters"],x:"Pretrained layers already encode useful features. A large LR can overwrite them ('catastrophic forgetting'). A small LR (e.g., 1e-4 vs 1e-3) lets the features adapt gently to the new task.",s:"exercise-10-transfer-learning"},
{m:"5B",c:"Concept",q:"An LSTM's cell state primarily helps with:",a:"Carrying information across long sequences without gradient degradation",d:["Reducing model size","Speeding up training","Handling variable batch sizes"],x:"The cell state is a 'gradient highway' — it flows through the network with only additive interactions (no repeated multiplication), preventing vanishing gradients over long sequences. Gates control what information enters and leaves.",s:"exercise-11-sequence-modeling-with-lstm"},
{m:"5B",c:"Concept",q:"An autoencoder's latent space learns structure without labels because:",a:"Reconstruction loss forces the bottleneck to capture the most important factors of variation",d:["It uses a special supervised loss","The decoder provides labels","Random initialization creates clusters"],x:"The bottleneck is narrower than the input, so the network must learn a compressed representation that retains enough information to reconstruct. Similar inputs get similar codes, creating structure.",s:"exercise-12-autoencoder-for-unsupervised-representation-learning"},
{m:"5B",c:"API",q:"What does filter(lambda p: p.requires_grad, model.parameters()) do when passed to an optimizer?",a:"Ensures the optimizer only updates unfrozen (trainable) parameters",d:["Removes all biases","Selects only the largest parameters","Filters out NaN gradients"],x:"In transfer learning with frozen layers, you don't want the optimizer tracking frozen parameters (wastes memory, could cause errors). This filter passes only parameters where requires_grad=True.",s:"exercise-10-transfer-learning"},

// Part 1
{m:"1B",q:"Polynomial regression is a nonlinear model.",a:false,x:"The features $\\phi(x) = [1, x, x^2, \\ldots]$ are nonlinear transforms of the input. But $y = \\mathbf{w}^\\top \\phi(x)$ is a linear combination of these features weighted by $\\mathbf{w}$. 'Linear model' means linear in the parameters being learned, not in the raw input.",s:"6-polynomial-regression-and-basis-functions"},
{m:"1B",q:"Ridge can set coefficients to exactly zero.",a:false,x:"Ridge (L2) penalty gradient gets smaller as w approaches zero, so it asymptotically shrinks but never zeroes out. Lasso (L1) has a constant-magnitude subgradient that can push coefficients to exactly zero when the data gradient is smaller than $\\lambda$.",s:"7-regularization-controlling-complexity"},
{m:"1B",q:"OLS (Ordinary Least Squares) = MLE (Maximum Likelihood Estimation) under Gaussian noise.",a:true,x:"If errors are iid $\\mathcal{N}(0, \\sigma^2)$, maximizing likelihood = minimizing squared error.",s:"4-the-probabilistic-view"},
{m:"1B",q:"Elastic Net combines L1 and L2 penalties.",a:true,x:"Pure Lasso (L1) selects features but arbitrarily picks one from correlated groups. Pure Ridge (L2) keeps all features but zeros none. Elastic Net combines both: L1 drives unimportant weights to zero, L2 ensures correlated features are kept or dropped together (grouping effect).",s:"7-regularization-controlling-complexity"},
{m:"1C",q:"Naive Bayes requires features to actually be independent.",a:false,x:"Almost always wrong, but works because only the decision boundary needs to be correct.",s:"6-naive-bayes"},
{m:"1C",q:"SVM (Support Vector Machine) boundary depends only on support vectors.",a:true,x:"The SVM solution depends only on points closest to the decision boundary (support vectors). All other points could be moved or removed without changing the boundary. This makes SVMs memory-efficient and robust to outliers far from the margin.",s:"7-support-vector-machines-svms"},
{m:"1C",q:"Logistic regression outputs probabilities; SVM natively does not.",a:true,x:"Logistic regression directly models $P(y=1|x)$ via sigmoid — its output is a calibrated probability. SVMs output signed distance to the boundary (margin score), not a probability. To get probabilities, you fit a sigmoid to margin scores after training (Platt scaling).",s:"7-support-vector-machines-svms"},
{m:"1C",q:"A higher AUC (Area Under the Curve) always means a better model for your use case.",a:false,x:"AUC measures overall ranking, but your use case may care about a specific threshold.",s:"8-evaluating-classifiers"},
{m:"1D",q:"More CV folds always give a better model.",a:false,x:"With more folds, each training set is larger (closer to full data), reducing bias. But each validation set is smaller and folds overlap more, increasing variance. Leave-one-out (k=n) is nearly unbiased but high-variance and expensive. k=5 or k=10 is the standard compromise.",s:"2-cross-validation"},
{m:"1D",q:"Standardizing on entire dataset before splitting is data leakage.",a:true,x:"When you compute mean/std on the entire dataset including test, then standardize, the training data 'knows' something about the test distribution. This inflates performance estimates. Always fit preprocessing on training data only, then apply the same transform to test.",s:"8-common-pitfalls"},
{m:"1E",q:"Adding more trees to gradient boosting can overfit.",a:true,x:"Unlike RF, boosting builds sequentially and can overfit. Use early stopping.",s:"5-boosting-learning-from-mistakes"},
{m:"1E",q:"Random Forests overfit by adding too many trees.",a:false,x:"Each RF tree is independent. Adding more independent estimates to an average reduces variance (law of large numbers) but can never increase it. Contrast with boosting, where each tree depends on all previous ones and can chase noise.",s:"4-random-forests"},
{m:"1E",q:"Gradient boosting uses weak learners (shallow trees).",a:true,x:"Each tree is intentionally shallow (depth 4-8, a 'weak learner'). Individual trees underfit, but each subsequent tree corrects the ensemble's errors so far. The cumulative effect of many weak corrections produces a strong learner. Deep trees would overfit the residuals at each step.",s:"5-boosting-learning-from-mistakes"},
{m:"1E",q:"Cost-complexity pruning adds $\\alpha \\cdot |T|$ to tree loss.",a:true,x:"$C_\\alpha(T) = \\text{errors} + \\alpha \\cdot |T|$. Larger $\\alpha$ = simpler tree.",s:"1-decision-trees"},
{m:"1F",q:"PCA (Principal Component Analysis) components are orthogonal.",a:true,x:"The covariance matrix is symmetric and positive semi-definite. By the spectral theorem, symmetric matrices have orthogonal eigenvectors. Since PCA components are these eigenvectors, they are guaranteed orthogonal — each captures variance in a direction uncorrelated with all previous components.",s:"1-principal-component-analysis-pca"},
{m:"1F",q:"K-Means always finds the global optimum.",a:false,x:"K-Means alternates between assigning points to nearest centroids and updating centroids to cluster means. Each step reduces the objective, but only to a local minimum that depends on initialization. Different random starts can give very different clusters. K-Means++ spreads initial centroids apart for more consistent results.",s:"2-k-means-clustering"},
{m:"1F",q:"t-SNE embeddings can be used as features for a classifier.",a:false,x:"t-SNE optimizes a non-convex objective with random initialization, so different runs give different results. It preserves local neighborhoods (nearby points stay nearby) but distorts global structure — between-cluster distances and cluster sizes are arbitrary. Using these as classifier features would capture artifacts, not real structure.",s:"5-dimensionality-reduction-beyond-pca"},
{m:"1F",q:"EM (Expectation-Maximization) log-likelihood is guaranteed to increase each step.",a:true,x:"EM optimizes ELBO (Evidence Lower Bound). Each step tightens and maximizes the bound.",s:"4-gaussian-mixture-models-gmms-and-the-em-algorithm"},
// Part 2
{m:"2A",q:"A single hidden layer can approximate any continuous function.",a:true,x:"Universal Approximation Theorem. But says nothing about learnability or efficiency.",s:"4-feedforward-networks-mlps"},
{m:"2A",q:"ReLU is differentiable everywhere.",a:false,x:"Undefined at x=0 (technically). In practice, we use the subgradient (0 or 1).",s:"3-activation-functions"},
{m:"2B",q:"Adam always converges to a better solution than SGD (Stochastic Gradient Descent).",a:false,x:"SGD with momentum often generalizes better. Adam can converge to sharper minima.",s:"5-optimizers-in-depth"},
{m:"2B",q:"Batch normalization eliminates the need for careful initialization.",a:false,x:"Helps significantly but good initialization still matters, especially for very deep nets.",s:"6-batch-normalization"},
{m:"2C",q:"Dropout is used at test time in standard inference.",a:false,x:"Dropout is off at test time. Weights are scaled, or use inverted dropout during training.",s:"3-dropout"},
{m:"2C",q:"Double descent contradicts the classical bias-variance tradeoff.",a:true,x:"Test error can decrease again past the interpolation threshold with very large models.",s:"8-the-double-descent-phenomenon"},
{m:"2D",q:"CNNs (Convolutional Neural Networks) always need pooling layers.",a:false,x:"Modern architectures (like all-convolutional nets) can use strided convolutions instead.",s:"4-pooling-layers"},
{m:"2D",q:"Transfer learning works even across very different domains.",a:true,x:"Early layers learn universal features (edges, textures) useful across domains.",s:"7-transfer-learning"},
{m:"2E",q:"LSTMs (Long Short-Term Memory networks) completely solve the vanishing gradient problem.",a:false,x:"They mitigate it significantly via the cell state highway, but don't eliminate it entirely for very long sequences.",s:"4-long-short-term-memory-lstm"},
{m:"2E",q:"Bidirectional RNNs (Recurrent Neural Networks) can be used for real-time generation.",a:false,x:"They need the full sequence (past and future) — can't generate token by token.",s:"6-bidirectional-rnns"},
// Part 3
{m:"3A",q:"Transformers process tokens sequentially like RNNs (Recurrent Neural Networks).",a:false,x:"RNNs process tokens one at a time — token 5's hidden state depends on token 4's, which depends on 3's. Inherently sequential. Transformers compute attention between all token pairs simultaneously in a single matrix multiplication, enabling massive GPU parallelism.",s:"2-self-attention-attention-without-encoder-decoder"},
{m:"3A",q:"Positional encoding is learned in all Transformer variants.",a:false,x:"The original Transformer (Vaswani et al. 2017) used fixed sine/cosine functions at different frequencies — no learned parameters. Later models like BERT and GPT learn position embeddings during training. Both work; the key is that some positional signal must be injected since attention itself is permutation-invariant.",s:"5-positional-encoding-giving-transformers-a-sense-of-order"},
{m:"3B",q:"GANs (Generative Adversarial Networks) directly maximize data likelihood.",a:false,x:"VAEs and diffusion models maximize a likelihood objective (or a bound on it). GANs train a generator to fool a discriminator — the generator never computes $P(x)$ directly. This is why GANs produce sharp samples but are harder to evaluate and less stable to train.",s:"4-generative-adversarial-networks-gans"},
{m:"3B",q:"Diffusion models are currently state-of-the-art for image generation.",a:true,x:"DALL-E 2/3, Stable Diffusion, Imagen — all diffusion-based (as of 2024).",s:"5-diffusion-models-the-current-frontier"},
{m:"3C",q:"BERT (Bidirectional Encoder Representations from Transformers) can generate text autoregressively.",a:false,x:"BERT sees full context (left and right) simultaneously via masked self-attention — great for understanding but can't generate text since it needs future tokens. GPT uses causal (left-to-right) masking, seeing only past tokens, enabling autoregressive generation one token at a time.",s:"3-language-self-supervision"},
{m:"3D",q:"Q-Learning requires a model of the environment.",a:false,x:"Model-based RL learns transition probabilities $P(s'|s,a)$ and plans using them. Q-Learning skips this — it updates Q-values directly from observed (state, action, reward, next state) tuples via the Bellman equation. No model of the environment is ever built.",s:"6-temporal-difference-learning-the-key-innovation"},
{m:"3D",q:"In RL (Reinforcement Learning), $\\gamma=1$ means the agent treats all future rewards equally.",a:true,x:"With $\\gamma=1$, the agent sums all future rewards without decay, weighting a reward 1000 steps away the same as an immediate one. In episodic tasks this is fine (finite horizon). In continuing tasks, the sum can diverge to infinity, making value functions undefined.",s:"2-markov-decision-processes-mdps"},
// Part 4
{m:"4A",q:"BPE (Byte Pair Encoding) tokenization can handle words never seen during training.",a:true,x:"BPE builds a vocabulary of frequent subword units (e.g., 'un', 'happi', 'ness'). A word never seen in training decomposes into known pieces. Worst case, any word reduces to individual characters, which are always in vocabulary — eliminating out-of-vocabulary problems entirely.",s:"2-tokenization-turning-text-into-numbers"},
{m:"4A",q:"Word2Vec produces context-dependent embeddings.",a:false,x:"Word2Vec assigns a single fixed vector per word regardless of context — 'bank' has the same embedding whether it means a river bank or a financial bank. BERT and GPT produce different embeddings for the same word depending on surrounding tokens, capturing polysemy and context.",s:"3-word-embeddings-the-ideas-that-still-matter"},
{m:"4B",q:"YOLO (You Only Look Once) is slower than R-CNN (Region-based CNN) but more accurate.",a:false,x:"YOLO is much faster (single pass) but traditionally less accurate than two-stage detectors.",s:"2-object-detection"},
{m:"4C",q:"AlphaZero was trained on human expert games.",a:false,x:"Unlike its predecessor AlphaGo (which bootstrapped from human expert games), AlphaZero started from random play and improved purely through self-play + MCTS. A neural network evaluates positions and guides search. Within hours it surpassed all prior systems in chess, shogi, and Go.",s:"3-multi-agent-rl-and-self-play"},
{m:"4D",q:"Gaussian Processes (GPs) scale well to millions of data points.",a:false,x:"GP prediction requires inverting an $N \\times N$ kernel matrix — $O(N^3)$ time, $O(N^2)$ memory. For 10k points this is already slow; for millions, intractable. Sparse GP methods (inducing points) approximate using $M \\ll N$ representative points, reducing cost to $O(NM^2)$.",s:"2-gaussian-processes"},
{m:"4D",q:"MAP (Maximum A Posteriori) estimation gives you uncertainty estimates.",a:false,x:"MAP is a point estimate (posterior mode). Full posterior needed for uncertainty.",s:"1-the-bayesian-philosophy"},
// Part 5
{m:"5B",q:"Tree-based models (Random Forests, GBMs) require feature scaling in sklearn.",a:false,x:"Trees split on thresholds, so monotone transforms of features don't change splits. Scaling is irrelevant. But distance/gradient-based models (SVM, logistic regression, neural nets) are affected by feature scale.",s:"exercise-2-classification-showdown"},
{m:"5B",q:"t-SNE (t-Distributed Stochastic Neighbor Embedding) preserves global distances between clusters.",a:false,x:"t-SNE preserves local neighborhoods — nearby points stay nearby. But distances between distant clusters are not meaningful. Don't interpret gaps or relative positions of well-separated clusters. Use PCA if you need to preserve global structure.",s:"exercise-6-dimensionality-reduction"},
{m:"5B",q:"In PyTorch, calling loss.backward() immediately updates the model weights.",a:false,x:".backward() computes gradients and stores them in .grad attributes. The actual weight update happens when you call optimizer.step(). This separation lets you inspect or modify gradients between computation and application.",s:"exercise-7-tensors-autograd-and-linear-regression-in-pytorch"},
{m:"5B",q:"torch.no_grad() should be used during the evaluation/test phase.",a:true,x:"During evaluation you don't need gradients — no learning happens. torch.no_grad() skips building the computation graph, saving significant memory. Without it, PyTorch tracks all operations for potential backward passes that never happen.",s:"exercise-8-mnist-feedforward-classifier"},
{m:"5B",q:"A pretrained ResNet used as a frozen feature extractor still needs to be in eval() mode.",a:true,x:"Even frozen layers contain BatchNorm, which behaves differently in train vs eval mode. In train mode, it uses batch statistics; in eval mode, running averages from pretraining. Using train mode on a frozen model corrupts the BatchNorm statistics.",s:"exercise-10-transfer-learning"},
{m:"5B",q:"An autoencoder is a generative model.",a:false,x:"A standard autoencoder learns to reconstruct inputs but has no principled way to sample new data — the latent space may have gaps or irregular structure. VAEs (Variational Autoencoders) add a KL regularization term that shapes the latent space into a smooth distribution you can sample from, making them truly generative.",s:"exercise-12-autoencoder-for-unsupervised-representation-learning"},

function reviewLink(mod, anchor){
  const slug=MOD_URL[mod];
  if(!slug)return "";
  const modInfo=PARTS.flatMap(p=>p.mods).find(m=>m.id===mod);
  const name=modInfo?modInfo.name:mod;
  const hash=anchor?"#"+anchor:"";
  return `<a class="review-link" href="./${slug}/${hash}" target="_blank">Review: ${mod} — ${name}</a>`;
}

// ===================== STATE =====================
let gScore=0, gStreak=0, gBest=0;
let curMode="quiz", curMod=null, curPart=null;
let used=new Set(), timer=null;

const app=document.getElementById("app");
const $=s=>document.querySelector(s);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function updateStats(){$("#globalScore").textContent=gScore;$("#globalStreak").textContent=gStreak;$("#globalBest").textContent=gBest;}
function pool(arr,mod){return mod?arr.filter(q=>q.m===mod):arr;}
function partMods(pid){return PARTS.find(p=>p.id===pid)?.mods.map(m=>m.id)||[];}
function poolPart(arr,pid){const ms=partMods(pid);return arr.filter(q=>ms.includes(q.m));}
function getPool(arr){if(curMod) return pool(arr,curMod);if(curPart) return poolPart(arr,curPart);return arr;}

document.getElementById("navTitle").addEventListener("click",()=>{curMod=null;curPart=null;used.clear();clearInterval(timer);showHome();});
